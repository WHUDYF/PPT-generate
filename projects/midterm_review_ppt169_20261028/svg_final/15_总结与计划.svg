    <text font-size="17" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="96" y="196">GPU 体系结构与模拟器学习，形成整机到流水线的架构图</text><text font-size="17" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="96" y="256">subcore RTL 流水线重构：130 次提交，顶层代码 −43%</text><text font-size="17" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="96" y="316">AI 生成 RTL 领域调研，研究问题收敛</text><text font-size="17" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="96" y="376">检查工具：逐指令比对、网表结构检查（发现 5 处分歧）</text><text font-size="17" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="96" y="436">基于 FML 的路线 B 实验：AI 写的 RTL 通过逐周期验收</text><text font-size="17" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="96" y="496">公司：参与 3 个、学习 1 个芯片项目，掌握设计—验证流程</text></g>

