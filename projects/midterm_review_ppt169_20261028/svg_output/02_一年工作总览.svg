<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="78" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="bold" fill="#1F3A5F">一年工作总览：三条线，一个研究问题</text>
    <line x1="60" y1="100" x2="1220" y2="100" stroke="#1F3A5F" stroke-width="2"/>
  </g>

  <g id="lane-gpu">
    <use data-icon="tabler-outline/cpu" x="60" y="132" width="32" height="32" fill="#1F3A5F" stroke-width="1.5"/>
    <text x="104" y="158" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#1F3A5F">GPU 学习</text>
    <text x="60" y="198" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">
      <tspan x="60" dy="0">研究对象：体系结构 → 模拟器与</tspan>
      <tspan x="60" dy="26">性能模型 → RTL 实现</tspan>
    </text>
  </g>

  <g id="lane-company">
    <use data-icon="tabler-outline/building-factory-2" x="460" y="132" width="32" height="32" fill="#5B7BA6" stroke-width="1.5"/>
    <text x="504" y="158" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#5B7BA6">公司学习</text>
    <text x="460" y="198" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">
      <tspan x="460" dy="0">工程参照：参与 3 个、学习 1 个</tspan>
      <tspan x="460" dy="26">芯片项目的设计—验证流程</tspan>
    </text>
  </g>

  <g id="lane-ai">
    <use data-icon="tabler-outline/bulb" x="860" y="132" width="32" height="32" fill="#C8102E" stroke-width="1.5"/>
    <text x="904" y="158" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#C8102E">AI for EDA</text>
    <text x="860" y="198" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">
      <tspan x="860" dy="0">研究问题：AI 写大规模 RTL 时，</tspan>
      <tspan x="860" dy="26">缺少一层可检查的规格与验收</tspan>
    </text>
  </g>

  <g id="timeline-track">
    <text x="60" y="290" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#6B7280">时间线（轴上方：研究线；轴下方：公司项目；空心点：学习或暂缓）</text>
    <line x1="60" y1="460" x2="1220" y2="460" stroke="#1F3A5F" stroke-width="2"/>
  </g>

  <g id="ms-a">
    <line x1="120" y1="460" x2="120" y2="490" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="120" cy="460" r="7" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <text x="120" y="514" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#9CA3AF">2025</text>
    <text x="120" y="540" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#6B7280">项目 A（学习）</text>
  </g>

  <g id="ms-gpu">
    <line x1="268" y1="430" x2="268" y2="460" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="268" cy="460" r="8" fill="#1F3A5F"/>
    <text x="268" y="390" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#1F3A5F">2025 下半年</text>
    <text x="268" y="416" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">GPU 体系结构入门</text>
  </g>

  <g id="ms-d">
    <line x1="416" y1="460" x2="416" y2="490" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="416" cy="460" r="8" fill="#5B7BA6"/>
    <text x="416" y="514" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#5B7BA6">2026.01</text>
    <text x="416" y="540" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">项目 D · OIS SoC</text>
  </g>

  <g id="ms-b">
    <line x1="564" y1="460" x2="564" y2="490" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="564" cy="460" r="8" fill="#5B7BA6"/>
    <text x="564" y="514" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#5B7BA6">2026.03</text>
    <text x="564" y="540" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">项目 B · 图像 DSP</text>
  </g>

  <g id="ms-trace">
    <line x1="712" y1="430" x2="712" y2="460" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="712" cy="460" r="7" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
    <text x="712" y="390" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#9CA3AF">2026.06</text>
    <text x="712" y="416" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#6B7280">trace 压缩（探索·暂缓）</text>
  </g>

  <g id="ms-c">
    <line x1="860" y1="460" x2="860" y2="490" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="860" cy="460" r="8" fill="#5B7BA6"/>
    <text x="860" y="514" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#5B7BA6">2026.06–09</text>
    <text x="860" y="540" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">项目 C · 光感芯片</text>
  </g>

  <g id="ms-rtl">
    <line x1="1008" y1="430" x2="1008" y2="460" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="1008" cy="460" r="8" fill="#1F3A5F"/>
    <text x="1008" y="390" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#1F3A5F">2026.10</text>
    <text x="1008" y="416" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">subcore RTL 重构</text>
  </g>

  <g id="ms-ir">
    <line x1="1156" y1="386" x2="1156" y2="460" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="1156" cy="460" r="10" fill="#C8102E"/>
    <text x="1220" y="346" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#C8102E">2026.10</text>
    <text x="1220" y="372" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">结构规范 · FML 实验</text>
  </g>

  <g id="takeaway">
    <rect x="60" y="600" width="1160" height="56" fill="#F5F7FA"/>
    <text x="84" y="636" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" fill="#222222">以 GPU 为对象、以工业流程为参照，收敛到研究问题：<tspan fill="#C8102E" font-weight="bold">如何验收 AI 生成的大规模 RTL</tspan></text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">硕士中期考核</text>
    <text x="1220" y="702" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">2</text>
  </g>
</svg>
