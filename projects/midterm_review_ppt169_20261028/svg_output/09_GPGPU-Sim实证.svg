<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5B7BA6"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="78" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="bold" fill="#1F3A5F">实证：在 GPGPU-Sim 上走通“规格 → AI 写 RTL → 验收”</text>
    <line x1="60" y1="100" x2="1220" y2="100" stroke="#1F3A5F" stroke-width="2"/>
  </g>

  <g id="base-fml">
    <rect x="60" y="126" width="360" height="300" fill="#F5F7FA"/>
    <text x="84" y="162" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="bold" fill="#1F3A5F">底座：FML 建模框架</text>
    <text x="84" y="188" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#6B7280">由合作者开发</text>
    <text x="84" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">
      <tspan x="84" dy="0">· Rust 写的周期级建模语言，</tspan>
      <tspan x="84" dy="26">　并行运行、结果确定</tspan>
      <tspan x="84" dy="34">· 已逐周期复现 GPGPU-Sim</tspan>
      <tspan x="84" dy="26">　（Volta QV100 配置）</tspan>
      <tspan x="84" dy="34">· rodinia 11 个基准：统计数据</tspan>
      <tspan x="84" dy="26">　与逐周期事件日志均与原版一致</tspan>
    </text>
  </g>

  <g id="flow-title">
    <text x="460" y="150" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="bold" fill="#1F3A5F">我的工作：路线 B 实验</text>
  </g>

  <g id="flow">
    <rect x="460" y="170" width="170" height="74" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="545" y="200" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#1F3A5F">切出一个流水级</text>
    <text x="545" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">写边界规格</text>
    <line x1="630" y1="207" x2="652" y2="207" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <rect x="658" y="170" width="170" height="74" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="743" y="200" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#1F3A5F">规格先对参照</text>
    <text x="743" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">偏差逐条登记</text>
    <line x1="828" y1="207" x2="850" y2="207" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <rect x="856" y="170" width="170" height="74" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="941" y="200" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#1F3A5F">AI 独立写 RTL</text>
    <text x="941" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">只给规格与接口</text>
    <line x1="1026" y1="207" x2="1048" y2="207" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <rect x="1054" y="170" width="166" height="74" rx="4" fill="#F5F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="1137" y="200" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#1F3A5F">边界逐周期验收</text>
    <text x="1137" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">lockstep 比对</text>
  </g>

  <g id="kpi-spec">
    <text x="460" y="318" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#1F3A5F">136 万</text>
    <text x="460" y="348" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="460" dy="0">周期上规格与参照逐周期一致</tspan>
      <tspan x="460" dy="22" fill="#6B7280">（取指 / 译码级）</tspan>
    </text>
  </g>

  <g id="kpi-levels">
    <text x="720" y="318" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#C8102E">435 → 42</text>
    <text x="720" y="348" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="720" dy="0">级：综合后最长逻辑路径</tspan>
      <tspan x="720" dy="22" fill="#6B7280">（拆分边界后，周期仅 +0.026%）</tspan>
    </text>
  </g>

  <g id="kpi-integ">
    <text x="1010" y="318" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#1F3A5F">551 万</text>
    <text x="1010" y="348" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="1010" dy="0">周期集成 subcore 通过</tspan>
      <tspan x="1010" dy="22" fill="#6B7280">（四个模块集成）</tspan>
    </text>
  </g>

  <g id="finding">
    <line x1="460" y1="400" x2="1220" y2="400" stroke="#E5E7EB" stroke-width="1"/>
    <text x="460" y="436" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">两个发现</text>
    <text x="460" y="472" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">
      <tspan x="460" dy="0">· 切边界时暴露出顺序模型里看不见的同拍组合环，需登记为偏差</tspan>
      <tspan x="460" dy="32">· 单个模块各自验收都通过，<tspan font-weight="bold" fill="#1F3A5F">集成时才暴露接口缺口</tspan>：</tspan>
      <tspan x="460" dy="28">　边界规格本身也需要被检查</tspan>
    </text>
  </g>

  <g id="base-note">
    <text x="84" y="466" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#6B7280">
      <tspan x="60" dy="0">参照模型是领域公认的 GPGPU-Sim，</tspan>
      <tspan x="60" dy="22">回答“只在自家 GPU 上验证”的局限</tspan>
    </text>
  </g>

  <g id="takeaway">
    <rect x="60" y="596" width="1160" height="56" fill="#F5F7FA"/>
    <text x="84" y="631" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" fill="#222222">结论：<tspan font-weight="bold" fill="#1F3A5F">有了边界规格，AI 写的 RTL 可以被逐周期验收</tspan>；规格还管住了结构，而不只是功能</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">硕士中期考核</text>
    <text x="1220" y="702" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">9</text>
  </g>
</svg>
