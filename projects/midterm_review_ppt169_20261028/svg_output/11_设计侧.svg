<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5B7BA6"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="78" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="bold" fill="#1F3A5F">设计侧：SoC 怎么集成，模块怎么写</text>
    <text x="1220" y="78" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#6B7280">三 · 公司学习</text>
    <line x1="60" y1="100" x2="1220" y2="100" stroke="#1F3A5F" stroke-width="2"/>
  </g>

  <g id="a-title">
    <text x="60" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="bold" fill="#1F3A5F">项目 A · RISC-V MCU SoC<tspan font-size="16" font-weight="normal" fill="#6B7280">（学习）</tspan></text>
    <text x="60" y="176" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#6B7280">学到：SoC 怎么集成、IP 怎么组织</text>
  </g>

  <g id="a-diagram">
    <rect x="60" y="196" width="250" height="44" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="185" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">RISC-V 核 + 协处理器接口</text>
    <rect x="360" y="196" width="250" height="44" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="485" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">脉动阵列加速器</text>
    <line x1="185" y1="240" x2="185" y2="262" stroke="#5B7BA6" stroke-width="1.5"/>
    <line x1="485" y1="240" x2="485" y2="262" stroke="#5B7BA6" stroke-width="1.5"/>
    <rect x="60" y="262" width="550" height="30" fill="#1F3A5F"/>
    <text x="335" y="283" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#FFFFFF">AHB 总线矩阵</text>
    <line x1="140" y1="292" x2="140" y2="312" stroke="#5B7BA6" stroke-width="1.5"/>
    <line x1="335" y1="292" x2="335" y2="312" stroke="#5B7BA6" stroke-width="1.5"/>
    <line x1="530" y1="292" x2="530" y2="312" stroke="#5B7BA6" stroke-width="1.5"/>
    <rect x="60" y="312" width="160" height="40" rx="4" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1"/>
    <text x="140" y="338" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">Flash（ECC / CRC）</text>
    <rect x="255" y="312" width="160" height="40" rx="4" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1"/>
    <text x="335" y="338" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">ROM / RAM</text>
    <rect x="450" y="312" width="160" height="40" rx="4" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1"/>
    <text x="530" y="338" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">DMA</text>
    <line x1="335" y1="352" x2="335" y2="372" stroke="#5B7BA6" stroke-width="1.5"/>
    <rect x="60" y="372" width="550" height="30" fill="#5B7BA6"/>
    <text x="335" y="393" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#FFFFFF">APB 外设总线</text>
    <rect x="60" y="412" width="550" height="40" rx="4" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1"/>
    <text x="335" y="438" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">SPI · I2C · GPIO · PWM · 模拟控制</text>
  </g>

  <g id="a-points">
    <text x="60" y="508" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">
      <tspan x="60" dy="0">· 按 IP 分目录，每个 IP 一份 filelist（约 160 个 RTL 文件）</tspan>
      <tspan x="60" dy="40">· 第三方 IP（RISC-V 核、ARM 总线）直接集成，不重复开发</tspan>
      <tspan x="60" dy="40">· 工艺单元、公司基础 IP（时钟门控、同步器）与业务 RTL</tspan>
      <tspan x="60" dy="28">　分层存放；RTL 中预留 MBIST 与 bypass 通路</tspan>
    </text>
  </g>

  <g id="b-title">
    <line x1="640" y1="126" x2="640" y2="660" stroke="#E5E7EB" stroke-width="1"/>
    <text x="670" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="bold" fill="#1F3A5F">项目 B · 光学位移传感器图像 DSP</text>
    <text x="670" y="176" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#6B7280">负责：DSP 验证 scoreboard　学到：单个模块怎么写</text>
  </g>

  <g id="b-diagram">
    <rect x="670" y="196" width="110" height="44" rx="4" fill="#1F3A5F"/>
    <text x="725" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#FFFFFF">IDLE</text>
    <line x1="780" y1="218" x2="834" y2="218" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <text x="807" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6B7280">opcode</text>
    <rect x="840" y="196" width="380" height="44" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="1030" y="224" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">9 类任务：NCC 匹配 · 亚像素 · 自动曝光 …</text>
    <rect x="670" y="262" width="550" height="66" rx="4" fill="#F5F7FA"/>
    <text x="690" y="290" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">
      <tspan x="690" dy="0">每个任务成对：X（工作态）⇄ WFNS_X（等待态）</tspan>
      <tspan x="690" dy="26">工作态编码为奇数 → bit0 直接作时钟门控使能</tspan>
    </text>
    <rect x="670" y="346" width="550" height="106" rx="4" fill="#FFFFFF" stroke="#5B7BA6" stroke-width="1"/>
    <text x="690" y="374" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">数据通路：valid / ready 握手的多级流水</text>
    <text x="690" y="412" font-family="Consolas, monospace" font-size="14" fill="#1F3A5F">Σx, Σx² → E(x), D(x) → Σxy → NCC</text>
    <text x="690" y="438" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#6B7280">16×16 像素阵列，位宽 int16 → int40</text>
  </g>

  <g id="b-points">
    <text x="670" y="508" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">
      <tspan x="670" dy="0">· 41 个状态的 FSM，工作 / 等待成对，按状态门控时钟</tspan>
      <tspan x="670" dy="40">· 数据通路统一 valid / ready 流水，复用参数化计数器</tspan>
      <tspan x="670" dy="40">· 接口按“源模块+目标模块_信号”命名，看名字知边界</tspan>
      <tspan x="670" dy="40" fill="#1F3A5F" font-weight="bold">→ 完成信号的写法，后来借鉴到 GPU subcore 重构</tspan>
    </text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">硕士中期考核</text>
    <text x="1220" y="702" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">11</text>
  </g>
</svg>
