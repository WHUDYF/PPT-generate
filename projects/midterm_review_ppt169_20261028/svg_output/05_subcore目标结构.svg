<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5B7BA6"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="78" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="32" font-weight="bold" fill="#1F3A5F">subcore 实现：7 个大级、预约表与 credit</text>
    <text x="1220" y="78" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#6B7280">一 · GPU 学习</text>
    <line x1="60" y1="100" x2="1220" y2="100" stroke="#1F3A5F" stroke-width="2"/>
  </g>

  <g id="pipeline">
    <rect x="60" y="122" width="150" height="116" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="74" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S0 取指</text>
    <text x="74" y="168" font-family="Consolas, monospace" font-size="12" fill="#5B7BA6">subcore_fetch</text>
    <text x="74" y="194" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222"><tspan x="74" dy="0">每个 subcore 一份</tspan><tspan x="74" dy="20">取指前端</tspan></text>
    <line x1="210" y1="180" x2="222" y2="180" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>

    <rect x="228" y="122" width="150" height="116" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="242" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S1 译码</text>
    <text x="242" y="168" font-family="Consolas, monospace" font-size="12" fill="#5B7BA6">subcore_decode</text>
    <text x="242" y="194" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222"><tspan x="242" dy="0">读指令缓冲 + 译码</tspan><tspan x="242" dy="20">head FIFO：2 项</tspan></text>
    <line x1="378" y1="180" x2="390" y2="180" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>

    <rect x="396" y="122" width="150" height="116" rx="4" fill="#F5F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="410" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S2 发射</text>
    <text x="410" y="168" font-family="Consolas, monospace" font-size="12" fill="#5B7BA6">subcore_issue</text>
    <text x="410" y="194" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222"><tspan x="410" dy="0">16 个 warp 选一个；</tspan><tspan x="410" dy="20">需 credit 与下游就绪</tspan></text>
    <line x1="546" y1="180" x2="558" y2="180" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>

    <rect x="564" y="122" width="150" height="116" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="578" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S3 分派</text>
    <text x="578" y="168" font-family="Consolas, monospace" font-size="12" fill="#5B7BA6">subcore_dispatch</text>
    <text x="578" y="194" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222"><tspan x="578" dy="0">按通道 + 操作码分流；</tspan><tspan x="578" dy="20">变长指令推入队列</tspan></text>
    <line x1="714" y1="180" x2="726" y2="180" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>

    <rect x="732" y="122" width="150" height="116" rx="4" fill="#F5F7FA" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="746" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S4 操作数</text>
    <text x="746" y="168" font-family="Consolas, monospace" font-size="12" fill="#5B7BA6">subcore_operand</text>
    <text x="746" y="194" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222"><tspan x="746" dy="0">按拍预约资源，</tspan><tspan x="746" dy="20">读寄存器 0–3 拍</tspan></text>
    <line x1="882" y1="180" x2="894" y2="180" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>

    <rect x="900" y="122" width="150" height="116" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="914" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S5 执行</text>
    <text x="914" y="168" font-family="Consolas, monospace" font-size="12" fill="#5B7BA6">subcore_exe</text>
    <text x="914" y="194" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222"><tspan x="914" dy="0">固定延迟单元：</tspan><tspan x="914" dy="20">VALU 6 级、SALU 4 级</tspan></text>
    <line x1="1050" y1="180" x2="1062" y2="180" stroke="#5B7BA6" stroke-width="1.5" marker-end="url(#arrowR)"/>

    <rect x="1068" y="122" width="152" height="116" rx="4" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="1082" y="148" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">SW 写回</text>
    <text x="1082" y="168" font-family="Consolas, monospace" font-size="12" fill="#5B7BA6">subcore_wb</text>
    <text x="1082" y="194" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222"><tspan x="1082" dy="0">寄存器堆，</tspan><tspan x="1082" dy="20">写口仲裁</tspan></text>

    <text x="60" y="262" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#6B7280">变长路径（访存、SFU、分支、FP64 等）经 S3 后的队列进入各自的“前门”模块；当前 RTL 已按此结构实现（常量前门除外）</text>
  </g>

  <g id="col-tables">
    <line x1="60" y1="286" x2="1220" y2="286" stroke="#E5E7EB" stroke-width="1"/>
    <text x="60" y="322" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#1F3A5F">S4 的四张预约表</text>
    <text x="60" y="356" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="60" dy="0">① 读口表：每个 bank 一张，带防饿死保留位</tspan>
      <tspan x="60" dy="30">② 写回拍表：按写口分（B0 / B1 / P / URF / UP）</tspan>
      <tspan x="60" dy="30">③ VALU 出口计数：每拍不超过 2</tspan>
      <tspan x="60" dy="30">④ VALU / SALU 入口拍表</tspan>
    </text>
    <text x="60" y="490" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#6B7280">
      <tspan x="60" dy="0">资源冲突从“同拍看 busy”改为“提前按拍预约”；</tspan>
      <tspan x="60" dy="22">数据相关仍由 stall + scoreboard 负责</tspan>
    </text>
  </g>

  <g id="col-credit">
    <text x="450" y="322" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#1F3A5F">变长路径：队列 + credit</text>
    <rect x="450" y="338" width="360" height="26" fill="#F5F7FA"/>
    <text x="462" y="356" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#1F3A5F">前门</text>
    <text x="700" y="356" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#1F3A5F">credit</text>
    <text x="462" y="386" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="462" dy="0">访存 LSU / AGU</tspan>
      <tspan x="462" dy="24">SFU / 跨 lane</tspan>
      <tspan x="462" dy="24">控制（分支、收敛、EXIT）</tspan>
      <tspan x="462" dy="24">张量 TQ / 异步</tspan>
      <tspan x="462" dy="24">FP64</tspan>
      <tspan x="462" dy="24">变长 VALU · CBU</tspan>
    </text>
    <text x="700" y="386" font-family="Consolas, monospace" font-size="14" fill="#222222">
      <tspan x="700" dy="0">8 / 2</tspan>
      <tspan x="700" dy="24">18</tspan>
      <tspan x="700" dy="24">1</tspan>
      <tspan x="700" dy="24">8 / 2</tspan>
      <tspan x="700" dy="24">5</tspan>
      <tspan x="700" dy="24">1 · 1</tspan>
    </text>
    <text x="450" y="544" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#6B7280">
      <tspan x="450" dy="0">发射时减 1，前门读完操作数后经事件加回；</tspan>
      <tspan x="450" dy="22">credit 等于队列深度，所以入队一定成功</tspan>
    </text>
  </g>

  <g id="col-events">
    <line x1="840" y1="304" x2="840" y2="600" stroke="#E5E7EB" stroke-width="1"/>
    <text x="866" y="322" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#1F3A5F">级间事件通道</text>
    <text x="866" y="348" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">源级寄存，目的级下一拍看到</text>
    <text x="866" y="380" font-family="Consolas, monospace" font-size="13" fill="#222222">
      <tspan x="866" dy="0">ev_head_consumed</tspan>
      <tspan x="866" dy="24">ev_complete</tspan>
      <tspan x="866" dy="24">ev_credit_return</tspan>
      <tspan x="866" dy="24">ev_branch_resolve</tspan>
      <tspan x="866" dy="24">ev_redirect</tspan>
      <tspan x="866" dy="24">ev_wb_wait</tspan>
    </text>
    <text x="1040" y="380" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#5B7BA6">
      <tspan x="1040" dy="0">S2 → S1</tspan>
      <tspan x="1040" dy="24">SW → S2</tspan>
      <tspan x="1040" dy="24">前门 → S2</tspan>
      <tspan x="1040" dy="24">控制前门 → S2</tspan>
      <tspan x="1040" dy="24">S2 → S0</tspan>
      <tspan x="1040" dy="24">SW → S4</tspan>
    </text>
    <text x="866" y="544" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#6B7280">
      <tspan x="866" dy="0">唯一的反向完成信号：</tspan>
      <tspan x="866" dy="22">S3 / S4 的在途掩码点对点送回 S2</tspan>
    </text>
  </g>

  <g id="takeaway">
    <rect x="60" y="610" width="1160" height="46" fill="#F5F7FA"/>
    <text x="84" y="640" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#222222">核心原则：<tspan font-weight="bold" fill="#1F3A5F">每级持有自己的状态，级间只走寄存过的事件</tspan>——固定路径不反压，变长路径靠 credit</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">硕士中期考核</text>
    <text x="1220" y="702" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#9CA3AF">5</text>
  </g>
</svg>
