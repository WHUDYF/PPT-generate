    <text x="876" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">2026 · 2604.14550</text>
    <text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="876" y="222">规格 → 知识图谱（层次、端口、</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="876" y="246">连线、依赖）→ 逐子模块生成；</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="876" y="270"><tspan>案例：<tspan font-weight="bold">RV32I 处理器</tspan></tspan>
    </text><line x1="876" y1="300" x2="1204" y2="300" stroke="#D8DEE6" stroke-width="1" />
