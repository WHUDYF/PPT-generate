    <text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="476" y="490">ISA 文档 → nano-operator IR →</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="476" y="514"><tspan>定制<tspan font-weight="bold">乱序核</tspan>；功能与性能优化</tspan>
      </text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="476" y="538">解耦，平均比 BOOM 快 2.35×</text><line x1="476" y1="568" x2="804" y2="568" stroke="#D8DEE6" stroke-width="1" />
