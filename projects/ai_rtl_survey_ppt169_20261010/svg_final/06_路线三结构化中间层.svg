    <text x="76" y="456" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">2026 · 2608.30659</text>
    <text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="76" y="490">Architectural Sketch（拓扑）+</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="76" y="514">Operational Spec（每模块功能与</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="76" y="538">接口）；VerilogEval pass@5 95.5%</text><line x1="76" y1="568" x2="404" y2="568" stroke="#D8DEE6" stroke-width="1" />
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" x="76" y="596">结构 = 拓扑 + 每模块规格</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" x="76" y="620">验证 = agent 选探针信号调试</text></g>
  <g id="card-agon">
    <path fill="#F4F6F9" d="M464,400 H816 A8,8 0 0 1 824,408 V636 A8,8 0 0 1 816,644 H464 A8,8 0 0 1 456,636 V408 A8,8 0 0 1 464,400 Z" />
