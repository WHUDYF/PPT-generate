    <text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="476" y="222">先生成系统级 IR，再生成 RTL；</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="476" y="246">配 60 个系统级设计（SysVDB）</text><line x1="476" y1="300" x2="804" y2="300" stroke="#D8DEE6" stroke-width="1" />
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" x="476" y="328">结构 = 系统级模块与连接</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" x="476" y="352">验证 = 功能仿真</text></g>
  <g id="card-verigraphi">
