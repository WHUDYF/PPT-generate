    <text x="76" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">NYU · MLCAD 2024 · 2407.18276</text>
    <text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="76" y="222">层次化提示：把处理器按模块</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="76" y="246">层次拆开，逐个生成再组装</text><line x1="76" y1="300" x2="404" y2="300" stroke="#D8DEE6" stroke-width="1" />
