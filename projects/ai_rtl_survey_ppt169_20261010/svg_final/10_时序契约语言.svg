<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F" />
    <text x="76" y="74" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">时序契约语言：已能写成类型，但只给人用</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">PL 社区把"流水级"和"信号何时有效"做成一等结构；没有一篇研究 LLM 会怎样违反这类契约</text>
  </g>
  <g id="table">
    <rect x="56" y="132" width="780" height="38" fill="#1F3A5F" />
    <text x="72" y="157" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">语言</text>
    <text x="252" y="157" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">把什么做成一等结构</text>
    <text x="612" y="157" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">边界</text>
    <rect x="56" y="170" width="780" height="68" fill="#F4F6F9" />
    <text x="72" y="198" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">Anvil</text>
    <text x="72" y="220" font-family="Consolas, monospace" font-size="12" fill="#666666">ASPLOS 2026 · 2503.19447</text>
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="198">模块间时序契约写进类型，静态排除</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="220">时序冒险；可按运行时事件参数化</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="198">最贴近动态 stall</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="220">无 LLM</text><text x="72" y="266" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">Filament</text>
    <text x="72" y="288" font-family="Consolas, monospace" font-size="12" fill="#666666">PLDI 2023 · 2304.10646</text>
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="266">timeline 类型：每个信号在哪几拍</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="288">有效，编译期检查</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="266">只覆盖静态调度</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="288">不含 warp 动态发射</text><rect x="56" y="306" width="780" height="68" fill="#F4F6F9" />
    <text x="72" y="334" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">PDL</text>
    <text x="72" y="356" font-family="Consolas, monospace" font-size="12" fill="#666666">Cornell · PLDI 2022（会议待核）</text>
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="334">按顺序语义写，自动生成带 stall /</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="356">冒险处理的流水线；级是语法单位</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="334">面向处理器流水</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="356">无 LLM</text><text x="72" y="402" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">Kôika</text>
    <text x="72" y="424" font-family="Consolas, monospace" font-size="12" fill="#666666">MIT · PLDI 2020</text>
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="402">规则式 HDL，带周期级调度语义，</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="424">Coq 证明</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="402">Bluespec 一脉</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="424">无 LLM</text><rect x="56" y="442" width="780" height="68" fill="#F4F6F9" />
    <text x="72" y="470" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">Latency-insensitive</text>
    <text x="72" y="492" font-family="Consolas, monospace" font-size="12" fill="#666666">Carloni · TCAD 2001（待核）</text>
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="470">valid / ready 通道让正确性与延迟</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="252" y="492">无关</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="470">"队列是桥梁"的</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="612" y="492">理论来源</text><text x="56" y="540" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">ReChisel / ChiseLLM：LLM 生成 Chisel，只换语法层，不带结构契约（2505.19734 · 2504.19144）</text>
  </g>
  <g id="contract-example">
    <path fill="#F4F6F9" d="M876,132 H1216 A8,8 0 0 1 1224,140 V636 A8,8 0 0 1 1216,644 H876 A8,8 0 0 1 868,636 V140 A8,8 0 0 1 876,132 Z" />
    
  <g transform="translate(892.0, 154.0) scale(1.0833333333333333)" fill="none" stroke="#E07A1F" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
    <path d="M12 7v5l3 3" />
  </g>
    <text x="928" y="174" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#222222">我们遇到的契约</text>
    <text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="892" y="214">原 RTL 隐含：</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#1F3A5F" x="892" y="240" font-weight="bold">同一 warp 两次发射间隔 ≥ 2 拍</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="892" y="276">依赖它的地方：</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="892" y="300">ITS 推进读寄存后的</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="892" y="322"><tspan><tspan font-family="Consolas, monospace" fill="#222222">sched_issue_valid_q</tspan></tspan>
      </text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="892" y="344"><tspan><tspan font-family="Consolas, monospace" fill="#222222">bra_hold</tspan> 来自寄存的 <tspan font-family="Consolas, monospace" fill="#222222">bra_state_q</tspan></tspan>
    </text><line x1="892" y1="368" x2="1200" y2="368" stroke="#D8DEE6" stroke-width="1" />
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="892" y="396">用 Filament 式写法会是：</text><path fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" d="M896,410 H1196 A4,4 0 0 1 1200,414 V470 A4,4 0 0 1 1196,474 H896 A4,4 0 0 1 892,470 V414 A4,4 0 0 1 896,410 Z" />
    <text font-size="13" font-family="Consolas, monospace" fill="#1F3A5F" x="904" y="436">issue[w] @ t  ⇒</text><text font-size="13" font-family="Consolas, monospace" fill="#1F3A5F" x="904" y="458">  ¬issue[w] @ t+1</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="892" y="506">2 项 FIFO 有意打破它；若契约</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="892" y="530">是显式的，依赖方会在编译 / 断言</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="892" y="554">时报出，而不是等端到端用例</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" x="892" y="594">空白：契约语言 × LLM 生成</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" x="892" y="618">两条线还没有交叉</text></g>
