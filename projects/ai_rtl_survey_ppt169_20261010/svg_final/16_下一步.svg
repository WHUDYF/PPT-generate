  <g id="item-5">
    <text x="56" y="512" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#E07A1F">05</text>
    <text x="128" y="496" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222222">契约挖掘原型</text>
    <text x="128" y="522" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">按流水级 / 事件通道生成模板，在基线 FST 上挖掘；用 G2 首轮模型检验能否在 iadd3 里提前报出</text>
