    <text x="128" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">CodeV-R1 / VeriReason 7B 本地部署；在 ArchXBench L4 子集上复现"全部失败"，确认评测链路可用</text>
    <line x1="128" y1="292" x2="1224" y2="292" stroke="#D8DEE6" stroke-width="1" />
  </g>
  <g id="item-3">
    <text x="56" y="344" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#E07A1F">03</text>
    <text x="128" y="328" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222222">跑第一组消融</text>
    <text x="128" y="354" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666"><tspan font-family="Consolas, monospace">subcore_issue_hold</tspan> 上 4 种条件 × ≥3 次，按 E 记录填写；用已有的 wave_compare / model_compare 出工件</text>
    <line x1="128" y1="376" x2="1224" y2="376" stroke="#D8DEE6" stroke-width="1" />
  </g>
  <g id="item-4">
    <text x="56" y="428" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#E07A1F">04</text>
    <text x="128" y="412" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222222">把已有失败写成缺陷记录</text>
    <text x="128" y="438" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">G2 首轮（同 warp 连续发射）、PR 38 <tspan font-family="Consolas, monospace">next_deadline</tspan> 组合环 → D 记录，标"本应被哪一层挡住"</text>
