    <text x="128" y="160" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#222222">补齐文献核实</text>
    <text x="128" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">GoldMine、IODINE、A-TEAM、latency-insensitive 的书目；PDL 会议名；agent 流程一路（VerilogCoder、MAGE 等）</text>
    <line x1="128" y1="208" x2="1224" y2="208" stroke="#D8DEE6" stroke-width="1" />
  </g>
  <g id="item-2">
    <text x="56" y="260" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#E07A1F">02</text>
