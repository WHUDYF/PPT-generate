  <g id="works">
    <rect x="56" y="260" width="1168" height="38" fill="#1F3A5F" />
    <text x="72" y="285" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">工作</text>
    <text x="272" y="285" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">做法</text>
    <text x="832" y="285" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">覆盖范围 / 局限</text>
    <rect x="56" y="298" width="1168" height="56" fill="#F4F6F9" />
    <text x="72" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">FormalRTL</text>
    <text x="72" y="344" font-family="Consolas, monospace" font-size="12" fill="#666666">2603.08738</text>
    <text x="272" y="332" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">软件参考模型作形式规格，多 agent：规划 + 生成 + 形式等价</text>
    <text x="832" y="332" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">工业级数据通路（自述）</text>
    <text x="72" y="380" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">AutoVeriFix+</text>
    <text x="72" y="400" font-family="Consolas, monospace" font-size="12" fill="#666666">2603.11489</text>
    <text x="272" y="388" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">Python 参考模型 + concolic 周期轨迹，定位并修复状态转移错误</text>
    <text x="832" y="388" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">有周期轨迹，但时序由模型给定</text>
    <rect x="56" y="410" width="1168" height="56" fill="#F4F6F9" />
    <text x="72" y="436" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">C2HLSC / HLSmith</text>
    <text x="72" y="456" font-family="Consolas, monospace" font-size="12" fill="#666666">2406.09233 · 2608.06791</text>
    <text x="272" y="444" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">LLM 把 C 改写成可综合的 HLS C，时序交给 HLS 调度</text>
    <text x="832" y="444" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">流水结构不由人或 LLM 决定</text>
    <text x="72" y="492" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">SymRTLO</text>
    <text x="72" y="512" font-family="Consolas, monospace" font-size="12" fill="#666666">NeurIPS 2025 · 2504.10369</text>
    <text x="272" y="500" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">LLM 重写 RTL 做 PPA 优化，等价检查保证行为不变</text>
    <text x="832" y="500" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">最像我们的"保持行为重构"</text>
