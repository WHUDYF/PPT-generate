    <text font-size="16" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="120" y="584"><tspan>这正是我们消融里的 <tspan font-family="Consolas, monospace" font-weight="bold" fill="#1F3A5F">model</tspan> 条件：给性能模型，不给结构框架。</tspan>
      </text><text font-size="16" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="120" y="614">预期它在 subcore 上能对齐功能，但会漏掉"同 warp 发射间隔 ≥ 2"这类契约——和 G2 首轮的失败模式一致。</text></g>
