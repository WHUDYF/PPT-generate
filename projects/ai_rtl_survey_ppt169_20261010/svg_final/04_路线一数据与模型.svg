<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F" />
    <text x="76" y="74" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">路线一：数据与模型——在模块级题目上已接近饱和</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">训练数据和奖励都来自模块级 testbench，多级流水能力基本没有被测过</text>
  </g>
  <g id="table">
    <rect x="56" y="132" width="760" height="40" fill="#1F3A5F" />
    <text x="72" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">模型</text>
    <text x="232" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">机构 · arXiv</text>
    <text x="432" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">怎么造数据 / 怎么训练</text>
    <rect x="56" y="172" width="760" height="58" fill="#F4F6F9" />
    <text x="72" y="207" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">RTLCoder</text>
    <text x="232" y="207" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">HKUST · 2312.08617</text>
    <text x="432" y="207" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">27K 条合成数据 + 质量感知训练，7B</text>
    <text x="72" y="265" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">CodeV</text>
    <text x="232" y="265" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">中科院计算所 · 2407.10424</text>
    <text x="432" y="265" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">真实代码多级摘要 → "描述→代码"对</text>
    <rect x="56" y="288" width="760" height="58" fill="#F4F6F9" />
    <text x="72" y="323" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">OriGen</text>
    <text x="232" y="323" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">PKU · 2407.16237</text>
    <text x="432" y="323" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">代码到代码增强 + 编译器反馈自修正</text>
    <text x="72" y="381" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">CraftRTL</text>
    <text x="232" y="381" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">NVIDIA · 2409.12993</text>
    <text x="432" y="381" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">K-map / FSM / 波形的构造即正确数据 + 注错</text>
    <rect x="56" y="404" width="760" height="58" fill="#F4F6F9" />
    <text x="72" y="439" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">VeriReason</text>
    <text x="232" y="439" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">2505.11849</text>
    <text x="432" y="439" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">SFT + GRPO，奖励 = testbench 结果</text>
    <text x="72" y="497" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">CodeV-R1</text>
    <text x="232" y="497" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">中科院计算所 · 2505.24183</text>
    <text x="432" y="497" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222">蒸馏 + RLVR，规则生成 testbench 判等价</text>
    <line x1="56" y1="520" x2="816" y2="520" stroke="#D8DEE6" stroke-width="1" />
    <text font-size="13" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="56" y="546">另有 VeriGen（NYU）、ChipNeMo（NVIDIA，未开源）、BetterV、MG-Verilog、AutoVCoder、VeriThoughts</text><text font-size="13" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="56" y="568">除 ChipNeMo 外多数开源；CodeV-R1、VeriReason 均有 7B 权重，可直接跑我们的任务</text></g>
  <g id="kpi">
    <path fill="#F4F6F9" d="M856,132 H1216 A8,8 0 0 1 1224,140 V360 A8,8 0 0 1 1216,368 H856 A8,8 0 0 1 848,360 V140 A8,8 0 0 1 856,132 Z" />
    <text x="872" y="168" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">VerilogEval v2 已报结果</text>
    <text x="872" y="226" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="44" font-weight="bold" fill="#1F3A5F">89–98%</text>
    <text x="872" y="256" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">前沿模型 / agent 流程</text>
    <line x1="872" y1="276" x2="1200" y2="276" stroke="#D8DEE6" stroke-width="1" />
    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="872" y="304"><tspan>开源 7B：CodeV-R1 <tspan font-weight="bold" fill="#E07A1F">68.6%</tspan>（v2）</tspan>
      </text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="872" y="328"><tspan>RTLLM <tspan font-weight="bold" fill="#E07A1F">72.9%</tspan>；VeriReason <tspan font-weight="bold" fill="#E07A1F">83.1%</tspan></tspan>
      </text><text font-size="13" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="872" y="352">（VerilogEval-Machine）</text></g>
  <g id="insight">
    <path fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" d="M856,388 H1216 A8,8 0 0 1 1224,396 V636 A8,8 0 0 1 1216,644 H856 A8,8 0 0 1 848,636 V396 A8,8 0 0 1 856,388 Z" />
    
  <g transform="translate(872.0, 408.0)" fill="none" stroke="#E07A1F" stroke-width="2">
    <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7" />
    <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3" />
    <path d="M9.7 17l4.6 0" />
  </g>
    <text x="906" y="427" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#222222">对我们意味着什么</text>
    <text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="872" y="464">分数高不代表能做流水线：题目多是</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="872" y="488">HDLBits 式组合或小时序电路</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="872" y="524"><tspan>可作<tspan font-weight="bold" fill="#1F3A5F">模型层 baseline</tspan>：同一个</tspan>
      </text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="872" y="548">subcore 模块上，比较"换模型"与</text><text font-size="15" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" x="872" y="572">"换中间表示"各带来多少差异</text><text x="872" y="616" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">数字来自各论文自报，评测设置不完全相同</text>
  </g>
