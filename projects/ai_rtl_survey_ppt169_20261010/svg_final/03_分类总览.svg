    <text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="84" y="208">① 数据与模型　② agent 流程（贯穿各级）</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="84" y="232">③ 结构化中间层　④ 参考模型 + 形式等价</text><text font-size="14" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" x="84" y="256">验证线：SVA / testbench / 波形反馈 / 契约语言</text></g>
