<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">我们的对比实验：同一模块、逐级加输入、加 baseline 方法</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">模块有参考实现和 0 差异比对工具，能区分"功能对"和"结构 / 时序对"</text>
  </g>
  <g id="modules">
    <rect x="56" y="132" width="360" height="236" rx="8" fill="#F4F6F9"/>
    <use data-icon="tabler-outline/cpu" x="76" y="152" width="24" height="24" fill="#2A7F9E" stroke-width="2"/>
    <text x="110" y="171" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#222222">被测模块</text>
    <text font-family="Consolas, monospace" font-size="15" fill="#1F3A5F">
      <tspan x="76" y="210" font-weight="bold">subcore_issue_hold</tspan>
    </text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="76" y="234">142 行，隐式 SB 置位 / 清除 / 同拍优先级</tspan>
    </text>
    <text font-family="Consolas, monospace" font-size="15" fill="#1F3A5F">
      <tspan x="76" y="274" font-weight="bold">subcore_decode</tspan>
    </text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="76" y="298">S1 2 项 head FIFO，含 G2 的契约陷阱</tspan>
      <tspan x="76" y="334">参考：<tspan font-family="Consolas, monospace" fill="#222222">8c17f5d73</tspan>、<tspan font-family="Consolas, monospace" fill="#222222">6e71a8d31</tspan></tspan>
    </text>
  </g>
  <g id="conditions">
    <text x="448" y="150" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#222222">条件（逐级叠加，已在 ai-rtl-study 中定义）</text>
    <rect x="448" y="166" width="180" height="58" rx="6" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="464" y="192" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#222222">nl</text>
    <text x="464" y="212" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">只给自然语言</text>
    <rect x="642" y="166" width="180" height="58" rx="6" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="658" y="192" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#222222">model</text>
    <text x="658" y="212" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">+ 功能 / 性能模型</text>
    <rect x="836" y="166" width="180" height="58" rx="6" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="852" y="192" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#222222">+style</text>
    <text x="852" y="212" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">+ 结构规范</text>
    <rect x="1030" y="166" width="194" height="58" rx="6" fill="#FFFFFF" stroke="#E07A1F" stroke-width="2"/>
    <text x="1046" y="192" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#E07A1F">+diagram</text>
    <text x="1046" y="212" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">+ 流水线图（11 号）</text>
    <text x="448" y="260" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#222222">外部 baseline 方法（同一模块上跑）</text>
    <rect x="448" y="276" width="374" height="92" rx="6" fill="#F4F6F9"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="464" y="302" font-weight="bold">参考模型 + 等价（FormalRTL 式）</tspan>
      <tspan x="464" y="326">结构 IR（VeriGraphi / 分层 IR 式）</tspan>
      <tspan x="464" y="350">波形反馈（SeqFeed 式）</tspan>
    </text>
    <rect x="836" y="276" width="388" height="92" rx="6" fill="#F4F6F9"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="852" y="302" font-weight="bold">模型：CodeV-R1 / VeriReason 7B</tspan>
      <tspan x="852" y="326">+ 一个商用前沿模型</tspan>
      <tspan x="852" y="350" fill="#666666">每个条件重复 ≥ 3 次（E 记录的重复序号）</tspan>
    </text>
  </g>
  <g id="metrics">
    <text x="56" y="408" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#222222">指标：从"能编译"一路到"时序契约没破"</text>
    <rect x="56" y="424" width="216" height="128" rx="8" fill="#F4F6F9"/>
    <text x="72" y="452" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#999999">1</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222"><tspan x="72" y="484" font-weight="bold">lint / 编译</tspan><tspan x="72" y="508" font-size="13" fill="#666666">Verilator，WIDTHTRUNC</tspan><tspan x="72" y="528" font-size="13" fill="#666666">为构建错误</tspan></text>
    <rect x="288" y="424" width="216" height="128" rx="8" fill="#F4F6F9"/>
    <text x="304" y="452" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#999999">2</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222"><tspan x="304" y="484" font-weight="bold">端到端 PASS</tspan><tspan x="304" y="508" font-size="13" fill="#666666">iadd3 · mix ·</tspan><tspan x="304" y="528" font-size="13" fill="#666666">control_flow · cp</tspan></text>
    <rect x="520" y="424" width="216" height="128" rx="8" fill="#F4F6F9"/>
    <text x="536" y="452" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#2A7F9E">3</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222"><tspan x="536" y="484" font-weight="bold">波形等价</tspan><tspan x="536" y="508" font-size="13" fill="#666666">u_subcore 约 10 万信号</tspan><tspan x="536" y="528" font-size="13" fill="#666666">差异数 + lockstep 拍数</tspan></text>
    <rect x="752" y="424" width="216" height="128" rx="8" fill="#F4F6F9"/>
    <text x="768" y="452" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#E07A1F">4</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222"><tspan x="768" y="484" font-weight="bold">契约违例</tspan><tspan x="768" y="508" font-size="13" fill="#666666">挖出的断言失败数、</tspan><tspan x="768" y="528" font-size="13" fill="#666666">首个错误拍</tspan></text>
    <rect x="984" y="424" width="240" height="128" rx="8" fill="#F4F6F9"/>
    <text x="1000" y="452" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="bold" fill="#1F3A5F">5</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222"><tspan x="1000" y="484" font-weight="bold">代价</tspan><tspan x="1000" y="508" font-size="13" fill="#666666">轮数、token、人工</tspan><tspan x="1000" y="528" font-size="13" fill="#666666">干预次数与分钟数</tspan></text>
  </g>
  <g id="hypothesis">
    <rect x="56" y="572" width="1168" height="72" rx="8" fill="#FFFFFF" stroke="#E07A1F" stroke-width="2"/>
    <use data-icon="tabler-outline/flask" x="76" y="594" width="26" height="26" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="116" y="600">假设：<tspan font-family="Consolas, monospace">model</tspan> 与外部 baseline 主要栽在指标 3、4（<tspan font-family="Consolas, monospace">structure</tspan> / <tspan font-family="Consolas, monospace">cycle-semantics</tspan> 类缺陷），</tspan>
      <tspan x="116" y="626">加规范和图后这两类明显减少；剩下的时序契约类缺陷需要验证框架才能挡住</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="694" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · AI 生成 RTL 综述 · 2026-10</text>
    <text x="1224" y="694" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">15</text>
  </g>
</svg>
