<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">下一步</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">先把对照组跑起来，再谈贡献；请老师和同学补充漏掉的工作</text>
  </g>
  <g id="item-1">
    <text x="56" y="176" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">01</text>
    <text x="128" y="160" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#222222">补齐文献核实</text>
    <text x="128" y="186" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">GoldMine、IODINE、A-TEAM、latency-insensitive 的书目；PDL 会议名；agent 流程一路（VerilogCoder、MAGE 等）</text>
    <line x1="128" y1="208" x2="1224" y2="208" stroke="#D8DEE6" stroke-width="1"/>
  </g>
  <g id="item-2">
    <text x="56" y="260" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">02</text>
    <text x="128" y="244" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#222222">拉起外部 baseline</text>
    <text x="128" y="270" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">CodeV-R1 / VeriReason 7B 本地部署；在 ArchXBench L4 子集上复现"全部失败"，确认评测链路可用</text>
    <line x1="128" y1="292" x2="1224" y2="292" stroke="#D8DEE6" stroke-width="1"/>
  </g>
  <g id="item-3">
    <text x="56" y="344" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">03</text>
    <text x="128" y="328" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#222222">跑第一组消融</text>
    <text x="128" y="354" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666"><tspan font-family="Consolas, monospace">subcore_issue_hold</tspan> 上 4 种条件 × ≥3 次，按 E 记录填写；用已有的 wave_compare / model_compare 出工件</text>
    <line x1="128" y1="376" x2="1224" y2="376" stroke="#D8DEE6" stroke-width="1"/>
  </g>
  <g id="item-4">
    <text x="56" y="428" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">04</text>
    <text x="128" y="412" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#222222">把已有失败写成缺陷记录</text>
    <text x="128" y="438" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">G2 首轮（同 warp 连续发射）、PR 38 <tspan font-family="Consolas, monospace">next_deadline</tspan> 组合环 → D 记录，标"本应被哪一层挡住"</text>
    <line x1="128" y1="460" x2="1224" y2="460" stroke="#D8DEE6" stroke-width="1"/>
  </g>
  <g id="item-5">
    <text x="56" y="512" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">05</text>
    <text x="128" y="496" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="19" font-weight="bold" fill="#222222">契约挖掘原型</text>
    <text x="128" y="522" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">按流水级 / 事件通道生成模板，在基线 FST 上挖掘；用 G2 首轮模型检验能否在 iadd3 里提前报出</text>
  </g>
  <g id="ask">
    <rect x="56" y="560" width="1168" height="84" rx="8" fill="#F4F6F9"/>
    <use data-icon="tabler-outline/users" x="80" y="584" width="28" height="28" fill="#2A7F9E" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#222222">
      <tspan x="124" y="594">想听意见：baseline 组合够不够有说服力？是否还要加 HLS（Vitis / Catapult）作为工业对照？</tspan>
      <tspan x="124" y="622" fill="#666666" font-size="14">素材与核实记录：curryGPU 本地 document/survey/（三路检索结果 + 大纲）</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="694" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · AI 生成 RTL 综述 · 2026-10</text>
    <text x="1224" y="694" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">16</text>
  </g>
</svg>
