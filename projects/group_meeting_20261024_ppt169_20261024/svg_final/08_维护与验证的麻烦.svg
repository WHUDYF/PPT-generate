<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F" />
    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">流水结构不清晰，麻烦出在维护和验证上</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">原写法功能一直是对的，重构后整体周期也基本不变 —— 问题不在性能，而在"改不动、查不清"</text>
  </g>
  <g id="col-head">
    <text x="56" y="140" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#999999">问题</text>
    <text x="316" y="140" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#999999">原代码里的样子</text>
    <text x="796" y="140" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#999999">带来的麻烦 / 实例</text>
  </g>
  <g id="row-1">
    <path fill="#2A7F9E" d="M64,150 H292 A8,8 0 0 1 300,158 V296 A8,8 0 0 1 292,304 H64 A8,8 0 0 1 56,296 V158 A8,8 0 0 1 64,150 Z" />
    <text x="76" y="180" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" fill-opacity="0.85">① 可维护性</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="18" x="76" y="212">划不出级边界，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="18" x="76" y="238">改一处牵动几处</text><path fill="#1F3A5F" d="M324,150 H768 A8,8 0 0 1 776,158 V296 A8,8 0 0 1 768,304 H324 A8,8 0 0 1 316,296 V158 A8,8 0 0 1 324,150 Z" />
    <text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="178">// 资源冲突"现查"：exe 当拍组合给出 busy</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="202">assign wb_busy_o = wb_en;</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="222">fu_busy_o[0] = |pair_pending_q || ... ;</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="242">fu_ok = !fu_busy_i[sel_target_i];</text><text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="266">// S2 发不发取决于 exe 此刻的状态，</text><text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="286">// 所以 S2 和 exe 之间插不了寄存器</text><path fill="#F4F6F9" d="M800,150 H1216 A8,8 0 0 1 1224,158 V296 A8,8 0 0 1 1216,304 H800 A8,8 0 0 1 792,296 V158 A8,8 0 0 1 800,150 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="180">想加一级寄存器，得先把"现查 busy"整套换掉</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="210" font-weight="bold">实例：G3b 加 S2/S3 reg</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="232">第一步只能先用"保守 allocate"兜住（84bf17d56），</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="254">下一步换成 S4 预约表才算稳（5ada43467）</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="812" y="286">busy 粒度粗也是真的，但对整体周期影响很小</text></g>
  <g id="row-2">
    <path fill="#E07A1F" d="M64,318 H292 A8,8 0 0 1 300,326 V464 A8,8 0 0 1 292,472 H64 A8,8 0 0 1 56,464 V326 A8,8 0 0 1 64,318 Z" />
    <text x="76" y="348" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" fill-opacity="0.9">② 可验证性</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="18" x="76" y="380">状态没有主人，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="18" x="76" y="406">出错说不清哪一级</text><path fill="#1F3A5F" d="M324,318 H768 A8,8 0 0 1 776,326 V464 A8,8 0 0 1 768,472 H324 A8,8 0 0 1 316,464 V326 A8,8 0 0 1 324,318 Z" />
    <text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="346">// subcore_top.v，6169 行，顶层自己持有：</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="368">ITS、分支 / CONV 序列、SETMAXNREG 状态、</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="388">RF init 记账、读代理仲裁、上下文扫描</text><text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="414">// exec_pipe_top.v，5121 行：</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="434">分发 + 读口 + collect + 执行单元 + 写回仲裁</text><text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="456">// S4 有 11 个输出经 exe 绕回自己（U1）</text><path fill="#F4F6F9" d="M800,318 H1216 A8,8 0 0 1 1224,326 V464 A8,8 0 0 1 1216,472 H800 A8,8 0 0 1 792,464 V326 A8,8 0 0 1 800,318 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="348">没有可以单独检查的"一级"：每条状态谁写、</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="370">每根线从哪级到哪级，都没有边界可对照</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="402"><tspan>验证只剩端到端用例：<tspan fill="#C62828" font-weight="bold">只知道结果错了，</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="424"><tspan><tspan fill="#C62828" font-weight="bold">不知道错在哪</tspan>；mix 最后报 128 处输出不一致，</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="446">给不出第一条出错的指令</text></g>
  <g id="row-3">
    <path fill="#C62828" d="M64,486 H292 A8,8 0 0 1 300,494 V632 A8,8 0 0 1 292,640 H64 A8,8 0 0 1 56,632 V494 A8,8 0 0 1 64,486 Z" />
    <text x="76" y="516" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" fill-opacity="0.9">③ 可验证性 · 真出过事</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="18" x="76" y="548">约束是隐式的，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="18" x="76" y="574">一改就坏</text><path fill="#1F3A5F" d="M324,486 H768 A8,8 0 0 1 776,494 V632 A8,8 0 0 1 768,640 H324 A8,8 0 0 1 316,632 V494 A8,8 0 0 1 324,486 Z" />
    <text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="514">// subcore_decode.v：每 warp 一个 head</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="536"><tspan>head 空了才补 → 同一 warp <tspan fill="#E07A1F">隔拍</tspan>才发一条</tspan>
      </text><text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="560">// its_top：发射后下一拍才推进 PC</text><text font-family="Consolas, monospace" fill="#FFFFFF" font-size="13" x="334" y="582">sched_issue_valid_q → its_cbu_advance_*</text><text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="606">// 两者正好对上，但没有任何文档写过</text><text font-family="Consolas, monospace" fill="#999999" font-size="13" x="334" y="626">// "同 warp 至少隔一拍"这条约束</text><path fill="#F4F6F9" d="M800,486 H1216 A8,8 0 0 1 1224,494 V632 A8,8 0 0 1 1216,640 H800 A8,8 0 0 1 792,632 V494 A8,8 0 0 1 800,486 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="516" font-weight="bold">实例：G2 把 head 改成两项 FIFO</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="540">同一 warp 可以连拍发射了，但 ITS 的 PC</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="562"><tspan><tspan fill="#C62828" font-weight="bold">晚一拍</tspan>，同一个 PC 发了两次</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="594"><tspan>iadd3 <tspan fill="#2E7D32">PASS</tspan>；mix / control_flow 才报错，</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="812" y="616">最后靠看波形才找到原因</text></g>
  <g id="footer">
    <text x="56" y="696" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#999999">curryGPU · 组会 · 2026-10-24　|　依据：8c17f5d73 源码；84bf17d56、5ada43467；runs/G2；fml-rtl-proto/README.md</text>
