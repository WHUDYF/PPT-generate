    <text x="712" y="161" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F">能定位</text>
    <text x="676" y="216" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1F3A5F">第 2–3 条<tspan font-size="17" font-weight="normal" fill="#222222">　指令处报出分歧</tspan></text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="676" y="252">发射 trace 绑在 subcore_top 上，按线程和 ISS 比第一处分歧；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="676" y="276">对 G2 错误版本直接指向"ITS PC 推进晚一拍"</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="676" y="308">边界清楚后，"哪一级错了"可以回答；顺带挖出多个</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="676" y="332">真实 bug（读后写漏洞、X 传播、ELECT 选错 lane 等）</text></g>
