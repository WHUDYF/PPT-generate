    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">这样做的优势：能检查、能定位、能对齐、不变慢</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">结构清楚之后，验证从"整体跑通没有"变成"每一级是否和图一致"</text>
  </g>
  <g id="adv-check">
    <path fill="#F4F6F9" d="M64,124 H616 A8,8 0 0 1 624,132 V352 A8,8 0 0 1 616,360 H64 A8,8 0 0 1 56,352 V132 A8,8 0 0 1 64,124 Z" />
    <rect x="56" y="124" width="4" height="236" fill="#2E7D32" />
    
  <g transform="translate(76.0, 142.0) scale(1.0833333333333333)" fill="none" stroke="#2E7D32" stroke-width="2">
    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
    <path d="M21 21l-6 -6" />
  </g>
    <text x="112" y="161" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F">能检查</text>
    <text x="76" y="216" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#2E7D32">0<tspan font-size="17" font-weight="normal" fill="#222222">　S1–SW 六级结构"不一致"</tspan></text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="76" y="252">同一份结构数据既出图又查网表：层次、边界寄存器、表长、连线</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="76" y="276">网表里冒出 IR 没登记的触发器或连线，门禁直接拦下</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="308">首次跑就报出 5 个功能测试看不见的结构分歧（U1–U5），</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="332">其中一个来自自称"行为不变"的提交</text></g>
  <g id="adv-locate">
