    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="676" y="508">port_pressure −7.2%（固定 VALU 不再被变长序列挡住）；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="676" y="532">其余 sm_kernel 在 ±1.3% 内，SoC 周期基本不变</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="676" y="564">加了级间寄存器，但去掉了全局反压和空发，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="676" y="588">两者大致抵消</text></g>
