    <text x="112" y="417" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F">能和性能模型对齐</text>
    <text x="76" y="472" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#2A7F9E">≈ 0<tspan font-size="17" font-weight="normal" fill="#222222">　多数同步项的周期中位变化</tspan></text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="76" y="508">RTL 的结构决定（预约、credit、ELECT 延迟）可以逐项同步回模型；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="76" y="532">模型发射事件与 ISS 逐条对齐 0 不一致</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="564">7–14× 的周期差拆开后，统一口径下 iadd3 只差</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="588">1.2–1.3×，剩下的差距能指到具体路径</text></g>
