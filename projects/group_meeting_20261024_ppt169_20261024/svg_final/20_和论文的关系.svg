<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F" />
    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">和论文的关系：FML 是"结构 IR 作需求规格"的载体</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">论文 v2（10-20）主线：以结构 IR 为需求规格，验收 AI 生成的大规模 RTL</text>
  </g>
  <g id="thesis">
    <path fill="#F4F6F9" d="M64,124 H608 A8,8 0 0 1 616,132 V416 A8,8 0 0 1 608,424 H64 A8,8 0 0 1 56,416 V132 A8,8 0 0 1 64,124 Z" />
    <text x="76" y="156" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">论文的四件事，FML 各补哪一块</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="194" font-weight="bold">① 需求带来源和状态</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="96" y="216">done / target / deviation；FML 模块上加注解即可</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="252" font-weight="bold">② 封闭世界</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="96" y="274">网表里 IR 没认领的触发器、连线一律报错（已有）</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="310" font-weight="bold">③ 三类检查</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="96" y="332"><tspan fill="#666666">逐指令比对、网表结构检查已有；<tspan fill="#E07A1F" font-weight="bold">事务间时序契约</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="96" y="354">原来缺载体 —— FML monitor 正好补上</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="390" font-weight="bold">④ 逃逸分析（建议作主贡献）</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="96" y="412">每层检查各抓住什么；第 11 页的 6 个案例是起点</text></g>
  <g id="novelty">
    <path fill="#1F3A5F" d="M64,440 H608 A8,8 0 0 1 616,448 V640 A8,8 0 0 1 608,648 H64 A8,8 0 0 1 56,640 V448 A8,8 0 0 1 64,440 Z" />
    
  <g transform="translate(76.0, 460.0)" fill="none" stroke="#E07A1F" stroke-width="2">
    <path d="M11 12a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
    <path d="M7 12a5 5 0 1 0 10 0a5 5 0 1 0 -10 0" />
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
  </g>
    <text x="110" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">新意检索的结论</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="76" y="512">每个单独机制都有先例；检索范围内没找到的是</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="76" y="536">组合与实证：用一份可执行结构 IR，在 AI 逐步</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="76" y="560">重构约 10 万行 GPU RTL 的每一步上，同时管住</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="76" y="584">结构、功能、时序三类需求，规格本身受门禁保护。</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" font-size="14" x="76" y="622">代价：6 个真实案例不够，要补跨层变异矩阵</text></g>
  <g id="related">
    <text x="648" y="148" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">最接近的工作</text>
    <path fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" d="M656,164 H1216 A8,8 0 0 1 1224,172 V302 A8,8 0 0 1 1216,310 H656 A8,8 0 0 1 648,302 V172 A8,8 0 0 1 656,164 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="668" y="194"><tspan font-weight="bold">HINT<tspan font-size="12" font-weight="normal" font-family="Consolas, monospace" fill="#999999">  2608.07625</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="668" y="222">LLM 先写结构 IR 再生成 RTL；算子 / VPU 级，固定 latency；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="668" y="246">IR 不可执行到逐拍，不处理反压和事务间关系；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#C62828" font-size="14" x="668" y="270">做的是生成，不是验收已有 RTL</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#2A7F9E" font-size="13" x="668" y="294">→ 我们的 IR 是能和 RTL 逐拍比的模型</text><path fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" d="M656,322 H1216 A8,8 0 0 1 1224,330 V460 A8,8 0 0 1 1216,468 H656 A8,8 0 0 1 648,460 V330 A8,8 0 0 1 656,322 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="668" y="352"><tspan font-weight="bold">Spec-Driven HW Evolution<tspan font-size="12" font-weight="normal" font-family="Consolas, monospace" fill="#999999">  2608.12684</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="668" y="380">人审的可执行契约 + hw-cbmc，增量修改已有 RTL；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="668" y="404"><tspan font-size="14" fill="#666666">契约只到单事务 IO 等价，<tspan fill="#C62828">有意不约束结构</tspan>；</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="668" y="428">只有约 2.2K 行 TPU 单案例</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#2A7F9E" font-size="13" x="668" y="452">→ 我们管结构 + 时序，规模约 10 万行</text><path fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" d="M656,480 H1216 A8,8 0 0 1 1224,488 V640 A8,8 0 0 1 1216,648 H656 A8,8 0 0 1 648,640 V488 A8,8 0 0 1 656,480 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="668" y="510"><tspan font-weight="bold">AmpereOne 性能验证<tspan font-size="12" font-weight="normal" font-family="Consolas, monospace" fill="#999999">  MICRO'26</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="668" y="538">RTL / 性能模型 / 实卡三方对齐；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="668" y="562">判据是聚合 IPC：90% 的测试在 ±10% 内，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#C62828" font-size="14" x="668" y="586">抓不到 A8 / b4 这种 6–8% 的回归，也定位不到原因</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#2A7F9E" font-size="13" x="668" y="614">→ 我们在事务级写契约（"WARPSYNC 分叉 ≤ 6 拍"），</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#2A7F9E" font-size="13" x="668" y="634">违例时直接给出拍和信号</text></g>
