<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F" />
    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">但这套流程有痛点：标准本身不能执行</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">drawio 图和结构数据只说"有什么、怎么连"；"每一拍做什么"仍然只在文档和人脑里</text>
  </g>
  <g id="pain-1">
    <path fill="#F4F6F9" d="M64,124 H608 A8,8 0 0 1 616,132 V234 A8,8 0 0 1 608,242 H64 A8,8 0 0 1 56,234 V132 A8,8 0 0 1 64,124 Z" />
    <text x="76" y="154" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#C62828">① 图只能静态比对</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="184">结构检查比的是网表"连没连、有没有寄存"，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="208">不知道寄存器里该是什么值；行为对不对只能靠端到端用例</text></g>
  <g id="pain-2">
    <path fill="#F4F6F9" d="M64,254 H608 A8,8 0 0 1 616,262 V364 A8,8 0 0 1 608,372 H64 A8,8 0 0 1 56,364 V262 A8,8 0 0 1 64,254 Z" />
    <text x="76" y="284" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#C62828">② 时序契约没有载体</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="314">A8 之后慢 6–7%：WARPSYNC 分叉每次 6 → 9 拍，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="338">E12–E15 几轮假设都没找到，最后靠人工统计停留拍数</text></g>
  <g id="pain-3">
    <path fill="#F4F6F9" d="M64,384 H608 A8,8 0 0 1 616,392 V494 A8,8 0 0 1 608,502 H64 A8,8 0 0 1 56,494 V392 A8,8 0 0 1 64,384 Z" />
    <text x="76" y="414" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#C62828">③ 设计问题到写 RTL 时才暴露</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="444">E1–E24、R1–R6 共 30 条决定是实现中新定或反推的；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="468">每次都要停下、改图、再继续 —— 图没法先"跑一下"</text></g>
  <g id="pain-4">
    <path fill="#F4F6F9" d="M64,514 H608 A8,8 0 0 1 616,522 V624 A8,8 0 0 1 608,632 H64 A8,8 0 0 1 56,624 V522 A8,8 0 0 1 64,514 Z" />
    <text x="76" y="544" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#C62828">④ 隐式契约一碰就坏</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="574">"同 warp 隔拍发射"没写在任何地方；G2 首版</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="598">改了 head FIFO，iadd3 PASS，构建一次要 623 s</text></g>
  <g id="cases">
    <text x="648" y="148" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">证据：6 个"功能验证通过、问题照样漏掉"</text>
    <rect x="648" y="164" width="576" height="32" fill="#1F3A5F" />
    <text x="664" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">类</text>
    <text x="730" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">案例</text>
    <text x="1000" y="186" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">后来谁抓住</text>
    <rect x="648" y="196" width="576" height="76" fill="#F4F6F9" />
    <text x="664" y="240" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#E07A1F">结构</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="730" y="224">S4 allocate 搬家，自称行为不变</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="730" y="256">两项 head FIFO，PC 晚一拍</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="1000" y="224">结构检查</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="1000" y="256">逐指令比对</text><text x="664" y="316" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2A7F9E">时序</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="730" y="300">A8 控制前门，慢 6–7%</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="730" y="332">b4 访存 bank，慢 8.53%</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="1000" y="300">周期对比 + 人工</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="1000" y="332">周期对比</text><rect x="648" y="348" width="576" height="76" fill="#F4F6F9" />
    <text x="664" y="392" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C62828">验证失效</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="730" y="376">旧脚本把有 fault 的运行判 PASS</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="730" y="408">断言文件静默失效</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="1000" y="376">事后人工发现</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="1000" y="408">新增 assert_check</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="648" y="452">时序类落在性能模型误差之内，只看"聚合周期 ±10%"抓不到；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="648" y="474">每一个都是事后、靠人、在端到端层面才发现的。</text></g>
