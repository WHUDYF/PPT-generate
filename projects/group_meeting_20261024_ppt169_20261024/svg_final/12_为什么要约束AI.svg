    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">文献里有人提到，我们自己的两周记录里也看得到；方案的出发点就是把 AI 的实现范围框住</text>
  </g>
