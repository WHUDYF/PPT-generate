  <g id="takeaway">
    <path fill="#FFFFFF" stroke="#E07A1F" stroke-width="1.5" d="M64,598 H1216 A8,8 0 0 1 1224,606 V642 A8,8 0 0 1 1216,650 H64 A8,8 0 0 1 56,642 V606 A8,8 0 0 1 64,598 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="76" y="620"><tspan>偏移不是 AI 独有：规格和实现分开维护，人也会偏；AI 只是让它<tspan fill="#E07A1F" font-weight="bold">更快、规模更大</tspan>。</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="76" y="642"><tspan>所以约束分两道：<tspan fill="#1F3A5F" font-weight="bold">写之前</tspan>规定每级能拥有什么、能传什么；<tspan fill="#1F3A5F" font-weight="bold">写之后</tspan>封闭世界门禁 + lockstep，越界就拦。</tspan>
    </text></g>
