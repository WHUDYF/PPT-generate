    <text x="934" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">方案管住哪一类</text>
    <path fill="#FFFFFF" d="M906,180 H1198 A6,6 0 0 1 1204,186 V278 A6,6 0 0 1 1198,284 H906 A6,6 0 0 1 900,278 V186 A6,6 0 0 1 906,180 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="916" y="206"><tspan font-weight="bold">结构偏移 <tspan fill="#2E7D32">· 主要目标</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="916" y="230">边界规格 + 封闭世界门禁 +</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="916" y="250">边界 lockstep：越界即拦</text><path fill="#FFFFFF" d="M906,296 H1198 A6,6 0 0 1 1204,302 V394 A6,6 0 0 1 1198,400 H906 A6,6 0 0 1 900,394 V302 A6,6 0 0 1 906,296 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="916" y="322"><tspan font-weight="bold">决策偏移 <tspan fill="#2A7F9E">· 部分</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="916" y="346">偏差必须引用登记过的条目；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="916" y="366">设计改动先改规格再改 RTL</text><path fill="#FFFFFF" fill-opacity="0.85" d="M906,412 H1198 A6,6 0 0 1 1204,418 V510 A6,6 0 0 1 1198,516 H906 A6,6 0 0 1 900,510 V418 A6,6 0 0 1 906,412 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="916" y="438"><tspan font-weight="bold">知识偏移 <tspan fill="#999999">· 不在本方案</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="916" y="462">来源、修订如何传播：</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="916" y="482">留给第二篇（决策台账实证）</text><text x="900" y="556" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.8">隐式约束 → 写成契约，归入结构偏移</text>
