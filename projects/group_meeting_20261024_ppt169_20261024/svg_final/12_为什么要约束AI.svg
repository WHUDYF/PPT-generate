    <text x="110" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">外部证据</text>
    <text x="464" y="158" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#999999">[ ] 内为阅读深度</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="194"><tspan font-weight="bold">Spec-Driven HW Evolution <tspan font-weight="normal" font-size="12" fill="#999999">[全文]</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="216">用隔离子代理防"指令漂移"；消融去掉后直接失败</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="250"><tspan font-weight="bold">IncreRTL <tspan font-weight="normal" font-size="12" fill="#999999">[只核过术语]</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="272">"structural drift"：增量生成 RTL 时结构逐步偏离</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="306"><tspan font-weight="bold">nano-kpu / HSCO-Bench / Hawkeye <tspan font-weight="normal" font-size="12" fill="#999999">[全文 / 源码]</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="328">零件都对，拼起来出问题；上下文太大会污染</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="362"><tspan font-weight="bold">HINT、Representation Bottleneck <tspan font-weight="normal" font-size="12" fill="#999999">[全文]</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="384">换表示 3% → 88%；换更强模型提升 &lt; 1.25×</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="418"><tspan font-weight="bold">CodeSpec <tspan font-weight="normal" font-size="12" fill="#999999">[方法部分，软件侧]</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="440">可执行架构规格，在长程开发中反复检查</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="474"><tspan font-weight="bold">软件架构一致性 <tspan font-weight="normal" font-size="12" fill="#999999">[原文 / 检索片段]</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="496">人写代码也会偏离架构（Rosik 2011）；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="516">JITTAC：4 个月后删掉的违规不到 50%；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="536">SAVE LiFe：每步实时检查，违规少约 60%</text></g>
