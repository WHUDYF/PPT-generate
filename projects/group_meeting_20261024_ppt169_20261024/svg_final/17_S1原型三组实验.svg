    <text x="690" y="288" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C62828">10–49 拍</text>
    <text x="772" y="288" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C62828">10–49 拍</text>
    <text x="490" y="330" font-family="Consolas, monospace" font-size="13" fill="#222222">G2</text>
    <text x="606" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C62828">10–49 拍</text>
    <path fill="#2E7D32" d="M658,308 H722 A4,4 0 0 1 726,312 V338 A4,4 0 0 1 722,342 H658 A4,4 0 0 1 654,338 V312 A4,4 0 0 1 658,308 Z" />
    <text x="690" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#FFFFFF">5/5 一致</text>
    <text x="772" y="330" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C62828">14–54 拍</text>
    <text x="490" y="372" font-family="Consolas, monospace" font-size="13" fill="#222222">G2a</text>
