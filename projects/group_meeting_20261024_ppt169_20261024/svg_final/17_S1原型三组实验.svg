    <text x="690" y="372" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#C62828">14–54 拍</text>
    <path fill="#2E7D32" d="M740,350 H804 A4,4 0 0 1 808,354 V380 A4,4 0 0 1 804,384 H740 A4,4 0 0 1 736,380 V354 A4,4 0 0 1 740,350 Z" />
