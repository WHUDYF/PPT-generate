    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">S1 原型：用 G2 首轮那个真实错误检验 FML</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">10-23，fml-rtl-proto；三个版本：G1 单项 head、G2 两项 FIFO（有错）、G2a 两项 FIFO + 屏蔽刚发射的 warp 一拍</text>
  </g>
  <g id="exp-a">
    <path fill="#F4F6F9" d="M64,124 H420 A8,8 0 0 1 428,132 V640 A8,8 0 0 1 420,648 H64 A8,8 0 0 1 56,640 V132 A8,8 0 0 1 64,124 Z" />
    <rect x="56" y="124" width="372" height="4" fill="#E07A1F" />
    <text x="76" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">A · 契约挂在模型上</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="186">C2：发射时 ITS 的 PC = 被发射指令的 PC</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="206">（PC 是辅助字段，RTL 里没有）</text><text x="76" y="268" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#E07A1F">第 48 拍</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="298">G2 被抓到：warp 15 在 47、48 拍连发，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="320">发的是 pc 2，ITS 还停在 pc 1</text><rect x="76" y="340" width="332" height="28" fill="#1F3A5F" />
    <text x="88" y="359" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">10⁶ 拍，C2 违例次数</text>
    <text font-family="Consolas, monospace" fill="#222222" font-size="14" x="88" y="392">G1</text><text font-family="Consolas, monospace" fill="#C62828" font-size="14" x="88" y="418" font-weight="bold">G2</text><text font-family="Consolas, monospace" fill="#222222" font-size="14" x="88" y="444">G2a</text><text font-family="Consolas, monospace" fill="#2E7D32" font-size="14" x="300" y="392">0</text><text font-family="Consolas, monospace" fill="#C62828" font-size="14" x="300" y="418" font-weight="bold">328177</text><text font-family="Consolas, monospace" fill="#2E7D32" font-size="14" x="300" y="444">0</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="484">每次约 3 s；1 个和 8 个 worker 结果相同</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="13" x="76" y="520" font-weight="bold">对比 RTL 那次：</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="542">模型构建 623 s，iadd3 端到端 PASS（漏掉）；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="564">mix / control_flow 只在最后报输出不一致，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="76" y="586">给不出第一条出错指令</text><text x="76" y="626" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#2A7F9E">另：发现手写契约 C1"隔拍发射"不精确</text>
  </g>
