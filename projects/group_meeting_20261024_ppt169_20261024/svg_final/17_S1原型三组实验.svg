    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="474" y="186">Verilator 记录 RTL 每拍的边界输入，回放给</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="474" y="206">FML 模型，逐拍比所有输出</text><rect x="474" y="226" width="332" height="30" fill="#1F3A5F" />
    <text x="490" y="246" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">FML \ RTL</text>
