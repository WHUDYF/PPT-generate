  <g id="exp-c">
    <path fill="#F4F6F9" d="M860,124 H1216 A8,8 0 0 1 1224,132 V640 A8,8 0 0 1 1216,648 H860 A8,8 0 0 1 852,640 V132 A8,8 0 0 1 860,124 Z" />
    <rect x="852" y="124" width="372" height="4" fill="#2A7F9E" />
    <text x="872" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">C · 结构规则在 IR 上查</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="872" y="186">G2 首轮的第二个毛病：refill_req 组合地</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="872" y="206">用了 S2 这拍的 issue_sel（违反规范）</text><path fill="#FFFFFF" d="M878,226 H1198 A6,6 0 0 1 1204,232 V338 A6,6 0 0 1 1198,344 H878 A6,6 0 0 1 872,338 V232 A6,6 0 0 1 878,226 Z" />
    <text x="888" y="252" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222">写法 1：S1 输出放一个 task</text>
    <text x="888" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C62828">FML 加载时直接拒绝：</text>
    <text font-family="Consolas, monospace" fill="#C62828" font-size="12" x="888" y="302">dependency cycle</text><text font-family="Consolas, monospace" fill="#C62828" font-size="12" x="888" y="322">S1.view → S2.pick → S1.view</text><path fill="#FFFFFF" d="M878,356 H1198 A6,6 0 0 1 1204,362 V468 A6,6 0 0 1 1198,474 H878 A6,6 0 0 1 872,468 V362 A6,6 0 0 1 878,356 Z" />
    <text x="888" y="382" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222">写法 2：拆成两个 task（同 RTL 连法）</text>
    <text x="888" y="408" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#222222">能加载；40 行规则脚本报出：</text>
    <text font-family="Consolas, monospace" fill="#C62828" font-size="12" x="888" y="432">VIOLATION view_refill drives</text><text font-family="Consolas, monospace" fill="#C62828" font-size="12" x="888" y="452">ib_req from S2.issue ('latest)</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="872" y="504">G1 / G2 / G2a 正常闭环：0 违例</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="13" x="872" y="540" font-weight="bold">说明：</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="872" y="562">内建检查是 task 粒度的组合环检查，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="872" y="584">无关输出放一个 task 会误报；"反向必须</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="872" y="606">过寄存器"要另写规则，但 IR 里信息齐全</text></g>
