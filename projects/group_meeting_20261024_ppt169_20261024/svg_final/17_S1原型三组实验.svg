    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="474" y="418">每格 5 个种子 × 20 万拍；每次约 16 万次</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="474" y="440">发射、3 万次 trap，含 flush 和 ctx_hold</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="474" y="484" font-weight="bold">对角线：逐拍完全一致</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="474" y="508">非对角线：直接报第一拍、第一个信号</text><path fill="#FFFFFF" d="M478,526 H802 A4,4 0 0 1 806,530 V562 A4,4 0 0 1 802,566 H478 A4,4 0 0 1 474,562 V530 A4,4 0 0 1 478,526 Z" />
    <text x="486" y="551" font-family="Consolas, monospace" font-size="12" fill="#C62828">cycle 30: head_valid_o: model 7609, RTL 5609</text>
