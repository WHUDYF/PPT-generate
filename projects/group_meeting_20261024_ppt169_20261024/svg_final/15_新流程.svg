    <text x="344" y="162" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">FML 结构模型</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="13" x="308" y="192">一级一个模块；状态只由主人的 commit 写；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="13" x="308" y="214">级间队列、事件通道、每拍行为都写成代码；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#E07A1F" font-size="13" x="308" y="236">写完先自己跑：契约、加载检查</text><line x1="590" y1="186" x2="634" y2="186" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrP)" />
  </g>
  <g id="derived">
