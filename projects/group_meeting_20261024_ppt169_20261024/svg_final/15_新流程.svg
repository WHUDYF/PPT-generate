    <text x="342" y="334" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F3A5F">AI 按级写 RTL</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="308" y="364">一次只改一级，接口按模型的边界；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="308" y="386">先保行为的搬迁，再改拍数</text><polyline points="290,352 268,352 268,214 286,214" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrW)" />
    <text x="64" y="300" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C62828">实现中发现设计问题：</text>
    <text x="64" y="320" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C62828">改模型，不是改图</text>
    <line x1="590" y1="352" x2="634" y2="352" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrP)" />
    <line x1="775" y1="246" x2="775" y2="290" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrP)" />
  </g>
  <g id="gate">
    <path fill="#2E7D32" d="M648,296 H1216 A8,8 0 0 1 1224,304 V400 A8,8 0 0 1 1216,408 H648 A8,8 0 0 1 640,400 V304 A8,8 0 0 1 648,296 Z" />
    <text x="660" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">门禁：四项全过才提交</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="660" y="354"><tspan><tspan font-weight="bold">①</tspan> 级边界上与 FML 逐拍 lockstep（新增）</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="660" y="382"><tspan><tspan font-weight="bold">②</tspan> 契约 monitor 0 违例（新增）</tspan>
    </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="950" y="354"><tspan><tspan font-weight="bold">③</tspan> 网表结构检查（已有）</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="14" x="950" y="382"><tspan><tspan font-weight="bold">④</tspan> 功能用例 + ISS（已有）</tspan>
    </text></g>
  <g id="compare">
    <text x="56" y="446" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">现在 vs 提议</text>
    <rect x="56" y="458" width="1168" height="30" fill="#1F3A5F" />
    <text x="72" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">环节</text>
    <text x="300" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">现在（drawio 为标准）</text>
    <text x="760" y="478" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#E07A1F">提议（FML 为标准）</text>
    <rect x="56" y="488" width="1168" height="32" fill="#F4F6F9" />
    <text x="72" y="509" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">图从哪来</text>
    <text x="300" y="509" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">Python 结构数据 + 排版脚本，和行为无关</text>
    <text x="760" y="509" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">从模型确定性派生，图和行为是同一份东西</text>
    <text x="72" y="541" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">设计问题何时暴露</text>
    <text x="300" y="541" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">写 RTL 时（30 条 E / R）</text>
    <text x="760" y="541" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">写模型、跑模型时；加载即拒组合环</text>
    <rect x="56" y="552" width="1168" height="32" fill="#F4F6F9" />
    <text x="72" y="573" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">时序约束</text>
    <text x="300" y="573" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">写在规范文档里，靠人记</text>
    <text x="760" y="573" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">只读 monitor，每次运行都查</text>
    <text x="72" y="605" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">行为是否对</text>
    <text x="300" y="605" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">端到端用例，构建一次几分钟，出错只知道结果不对</text>
    <text x="760" y="605" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">在级边界上 lockstep，直接给出第一拍、第一个信号</text>
    <rect x="56" y="616" width="1168" height="32" fill="#F4F6F9" />
    <text x="72" y="637" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">AI 的输入</text>
    <text x="300" y="637" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">看图 + 读清单，自己理解每拍行为</text>
    <text x="760" y="637" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">边界规格 + 边界上必须逐拍一致；级内自己实现</text>
  </g>
