  </g>
  <g id="fml-model">
    <path fill="#1F3A5F" d="M298,126 H582 A8,8 0 0 1 590,134 V238 A8,8 0 0 1 582,246 H298 A8,8 0 0 1 290,238 V134 A8,8 0 0 1 298,126 Z" />
    
  <g transform="translate(308.0, 142.0) scale(1.0833333333333333)" fill="none" stroke="#E07A1F" stroke-width="2">
