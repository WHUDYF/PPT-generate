  </g>
  <g id="oracle">
    <path fill="#FFFFFF" stroke="#2A7F9E" stroke-width="1.5" stroke-dasharray="4,4" d="M958,126 H1216 A8,8 0 0 1 1224,134 V238 A8,8 0 0 1 1216,246 H958 A8,8 0 0 1 950,238 V134 A8,8 0 0 1 958,126 Z" />
    
