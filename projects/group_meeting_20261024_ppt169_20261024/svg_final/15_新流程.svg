    <text x="682" y="192" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">约束清单、接口 → 给 AI</text>
    <path fill="#F4F6F9" d="M646,210 H904 A6,6 0 0 1 910,216 V240 A6,6 0 0 1 904,246 H646 A6,6 0 0 1 640,240 V216 A6,6 0 0 1 646,210 Z" />
    
