    <text x="996" y="160" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2A7F9E">参考：ISS / 性能模型</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="966" y="190">ISS 管"做对没有"；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="966" y="212">性能模型给契约的期望值</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="13" x="966" y="234">（多少拍）</text><line x1="950" y1="228" x2="916" y2="228" stroke="#2A7F9E" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrS)" />
  </g>
  <g id="rtl">
    <line x1="440" y1="246" x2="440" y2="294" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrP)" />
    <text x="452" y="276" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#666666">按级、按清单</text>
    <path fill="#F4F6F9" stroke="#1F3A5F" stroke-width="1.5" d="M298,300 H582 A8,8 0 0 1 590,308 V396 A8,8 0 0 1 582,404 H298 A8,8 0 0 1 290,396 V308 A8,8 0 0 1 298,300 Z" />
    
  <g transform="translate(308.0, 316.0)" fill="none" stroke="#1F3A5F" stroke-width="2">
    <path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4" />
    <path d="M12 2v2" />
    <path d="M9 12v9" />
