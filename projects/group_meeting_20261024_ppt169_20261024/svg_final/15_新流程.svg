    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">新流程：FML 模型是唯一来源，其余都从它派生</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">和第 4 页比：标准从"图"换成"能跑的边界规格"，验收多了"在级边界上和模型逐拍比"这一道</text>
  </g>
