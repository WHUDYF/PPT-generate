<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F" />
    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">原型说明了什么、没说明什么、缺什么</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">下一步要定义一个"能落到 RTL 的 FML 子集"：写进子集的模型，才能当 RTL 的标准</text>
  </g>
  <g id="shows">
    <path fill="#F4F6F9" d="M64,124 H420 A8,8 0 0 1 428,132 V386 A8,8 0 0 1 420,394 H64 A8,8 0 0 1 56,386 V132 A8,8 0 0 1 64,124 Z" />
    <rect x="56" y="124" width="4" height="270" fill="#2E7D32" />
    
  <g transform="translate(76.0, 142.0)" fill="none" stroke="#2E7D32" stroke-width="2">
    <path d="M7 12l5 5l10 -10" />
    <path d="M2 12l5 5m5 -5l5 -5" />
  </g>
    <text x="110" y="160" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">说明了</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="198">· FML 能把 S1 控制写到和 RTL 逐拍一致</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="92" y="220">15 × 20 万拍，约 250 行</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="254">· 契约写成只读 monitor，1 秒内抓到 G2</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="288">· lockstep 能把分歧定位到第一拍和信号</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="322">· 把契约写下来，会暴露不精确的契约</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="92" y="344">C1"隔拍发射"在有 hold 时不成立</text></g>
  <g id="not-shown">
    <path fill="#F4F6F9" d="M64,410 H420 A8,8 0 0 1 428,418 V640 A8,8 0 0 1 420,648 H64 A8,8 0 0 1 56,640 V418 A8,8 0 0 1 64,410 Z" />
    <rect x="56" y="410" width="4" height="238" fill="#C62828" />
    
  <g transform="translate(76.0, 428.0)" fill="none" stroke="#C62828" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="110" y="446" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">还没说明</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="484">· S2、ITS、IB 是抽象的，不和 RTL 逐拍一致</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="514">· 激励是随机的，不是真实 kernel</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="544">· 译码字段没比（译码器当 oracle）</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="76" y="574"><tspan>· <tspan fill="#C62828" font-weight="bold">边界级规格只在 S1 上试过</tspan>：S4 这类</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="92" y="596">有预约、多拍读窗口的级，边界事务还没定义</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="76" y="626">· G2 RTL 是复原的（原文件已不存在）</text></g>
  <g id="subset">
    <text x="460" y="148" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">原型里的摩擦 → "可落到 RTL 的子集"要补的规则</text>
    <rect x="460" y="162" width="764" height="34" fill="#1F3A5F" />
    <text x="476" y="185" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">遇到的摩擦</text>
    <text x="830" y="185" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">要补的规则 / 注解</text>
    <rect x="460" y="196" width="764" height="64" fill="#F4F6F9" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="476" y="222">"view 写连线、commit 写寄存器"</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="476" y="244">只是手工约定</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="830" y="222">变成可检查的子集规则</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="830" y="244">违反就不能当 RTL 标准</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="476" y="286">没有位宽：u8 / u16 / u128 只是容器</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="476" y="308">HEAD_BITS 等字段宽度不准</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="830" y="286">位宽注解，和 RTL 参数对齐</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="830" y="308">结构检查顺带查宽度</text><rect x="460" y="324" width="764" height="64" fill="#F4F6F9" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="476" y="350">级的信息不在 IR 里</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="476" y="372">现在靠命令行传 Split=1 S2=2</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="830" y="350">级注解写进模块</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="830" y="372">结构规则直接读</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="476" y="414">辅助字段（Entry::pc）</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="476" y="436">只为契约服务，RTL 不该有</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="830" y="414">ghost 标记</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="830" y="436">保证永远不落到 RTL</text><rect x="460" y="452" width="764" height="64" fill="#F4F6F9" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="476" y="478">模块里的定长数组被当成列</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="476" y="500">要包成 Plain 结构体</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="830" y="478">写成子集的固定写法</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="830" y="500">或请 FML 支持</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="476" y="542">组合环检查是 task 粒度</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="476" y="564">无关输出放一起会误报</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="830" y="542">规定每个输出组一个 view task</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="830" y="564">加 40 行级规则层</text><path fill="#FFFFFF" stroke="#E07A1F" stroke-width="1.5" d="M468,584 H1216 A8,8 0 0 1 1224,592 V640 A8,8 0 0 1 1216,648 H468 A8,8 0 0 1 460,640 V592 A8,8 0 0 1 468,584 Z" />
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="480" y="610"><tspan>有了这个子集，就可以从边界规格<tspan fill="#E07A1F" font-weight="bold">生成 RTL 骨架</tspan>（端口、级间寄存器、握手、</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="14" x="480" y="634"><tspan>状态声明）；级内行为<tspan fill="#E07A1F" font-weight="bold">不生成</tspan>，由 AI 写，在边界上和模型 lockstep。</tspan>
    </text></g>
  <g id="footer">
    <text x="56" y="696" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#999999">curryGPU · 组会 · 2026-10-24　|　依据：fml-rtl-proto/README.md "What this shows" 与 "Friction"</text>
