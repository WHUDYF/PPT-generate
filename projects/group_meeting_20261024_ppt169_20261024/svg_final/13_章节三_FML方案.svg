      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#FFFFFF" font-size="22" x="120" y="456"><tspan><tspan fill="#E07A1F" font-weight="bold">图、约束清单、契约</tspan>都从模型派生</tspan>
