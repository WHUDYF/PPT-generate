<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F" />
    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">FML 是什么，为什么适合当这一层</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">定位：性能模型管"做什么、多少拍"；FML 规格管"在哪一级做、每级拥有什么状态、两级之间传什么"</text>
  </g>
  <g id="what">
    <text x="56" y="148" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">四个特点</text>
    <path fill="#F4F6F9" d="M64,162 H548 A8,8 0 0 1 556,170 V266 A8,8 0 0 1 548,274 H64 A8,8 0 0 1 56,266 V170 A8,8 0 0 1 64,162 Z" />
    
  <g transform="translate(74.0, 178.0)" fill="none" stroke="#1F3A5F" stroke-width="2">
    <path d="M10 5a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M3 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M17 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M6.5 17.5l5.5 -4.5l5.5 4.5" />
    <path d="M12 7l0 6" />
  </g>
    <text x="108" y="196" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">模块 + 状态 + task</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="226">task 由时钟（整数皮秒）或事件（带最小延迟）触发，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="250">时钟和离散事件在同一个模型里</text><path fill="#F4F6F9" d="M64,286 H548 A8,8 0 0 1 556,294 V390 A8,8 0 0 1 548,398 H64 A8,8 0 0 1 56,390 V294 A8,8 0 0 1 64,286 Z" />
    
  <g transform="translate(74.0, 302.0)" fill="none" stroke="#E07A1F" stroke-width="2">
    <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
    <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
    <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
  </g>
    <text x="108" y="320" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">访存方式写进签名</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="350">每个 task 声明读"拍前的值"、读"本拍最新值"或写；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="374"><tspan>VM 据此推出全部顺序，有歧义（组合环）<tspan fill="#C62828" font-weight="bold">加载时就拒绝</tspan></tspan>
    </text><path fill="#F4F6F9" d="M64,410 H548 A8,8 0 0 1 556,418 V514 A8,8 0 0 1 548,522 H64 A8,8 0 0 1 56,514 V418 A8,8 0 0 1 64,410 Z" />
    
  <g transform="translate(74.0, 426.0)" fill="none" stroke="#1F3A5F" stroke-width="2">
    <path d="M21 17h-8l-3.5 -5h-6.5" />
    <path d="M21 7h-8l-3.495 5" />
    <path d="M18 10l3 -3l-3 -3" />
    <path d="M18 20l3 -3l-3 -3" />
  </g>
    <text x="108" y="444" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">并行而确定</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="474">不论几个 worker，结束状态、事件都完全相同；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="498">可以拿声明的顺序检查一次运行的轨迹</text><path fill="#F4F6F9" d="M64,534 H548 A8,8 0 0 1 556,542 V638 A8,8 0 0 1 548,646 H64 A8,8 0 0 1 56,638 V542 A8,8 0 0 1 64,534 Z" />
    
  <g transform="translate(74.0, 550.0)" fill="none" stroke="#1F3A5F" stroke-width="2">
    <path d="M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M5 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M15 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
    <path d="M7 8l0 8" />
    <path d="M7 8a4 4 0 0 0 4 4h4" />
  </g>
    <text x="108" y="568" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">边界开放</text>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="598">外部端口可接 trace、功能模型或联合仿真的 RTL；</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="14" x="74" y="622">Fifo 等组件可自定义；支持不停机快照</text></g>
  <g id="compare">
    <text x="588" y="148" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">和现在手里的几种"标准"比</text>
    <rect x="588" y="162" width="636" height="40" fill="#1F3A5F" />
    <text x="604" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">需要的能力</text>
    <text x="864" y="188" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">drawio + 结构数据</text>
    <text x="1012" y="188" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">性能模型</text>
    <text x="1148" y="188" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#E07A1F">FML</text>
    <rect x="588" y="202" width="636" height="44" fill="#F4F6F9" />
    <text x="604" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">描述级、状态主人、连线</text>
    <text x="864" y="230" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">✓</text>
    <text x="1012" y="230" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828">✗ 一个函数</text>
    <text x="1148" y="230" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">✓</text>
    <text x="604" y="274" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">每拍行为可执行</text>
    <text x="864" y="274" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828">✗</text>
    <text x="1012" y="274" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">事件级，非逐拍</text>
    <text x="1148" y="274" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">✓</text>
    <rect x="588" y="290" width="636" height="44" fill="#F4F6F9" />
    <text x="604" y="318" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">区分寄存器 / 连线</text>
    <text x="864" y="318" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">标注</text>
    <text x="1012" y="318" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828">✗</text>
    <text x="1148" y="318" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">由读法决定</text>
    <text x="604" y="362" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">组合环 / 反向组合检查</text>
    <text x="864" y="362" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">网表上事后查</text>
    <text x="1012" y="362" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828">✗</text>
    <text x="1148" y="362" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">加载时</text>
    <rect x="588" y="378" width="636" height="44" fill="#F4F6F9" />
    <text x="604" y="406" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">挂时序契约</text>
    <text x="864" y="406" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828">✗</text>
    <text x="1012" y="406" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">要改模型代码</text>
    <text x="1148" y="406" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">只读 monitor</text>
    <text x="604" y="450" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">和 RTL 逐拍比对</text>
    <text x="864" y="450" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828">✗</text>
    <text x="1012" y="450" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666">只能比周期总数</text>
    <text x="1148" y="450" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2E7D32" font-weight="bold">原型已验证</text>
    <rect x="588" y="466" width="636" height="44" fill="#F4F6F9" />
    <text x="604" y="494" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222">生成给人看的图</text>
    <text x="864" y="494" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">✓</text>
    <text x="1012" y="494" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#C62828">✗</text>
    <text x="1148" y="494" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#2A7F9E">待做</text>
    <path fill="none" stroke="#E07A1F" stroke-width="2" d="M1084,162 H1212 A4,4 0 0 1 1216,166 V506 A4,4 0 0 1 1212,510 H1084 A4,4 0 0 1 1080,506 V166 A4,4 0 0 1 1084,162 Z" />
    <path fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1" d="M596,530 H1216 A8,8 0 0 1 1224,538 V638 A8,8 0 0 1 1216,646 H596 A8,8 0 0 1 588,638 V538 A8,8 0 0 1 596,530 Z" />
    
  <g transform="translate(606.0, 548.0)" fill="none" stroke="#E07A1F" stroke-width="2">
    <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7" />
    <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3" />
    <path d="M9.7 17l4.6 0" />
  </g>
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="640" y="566">关键的一点：FML 里"读拍前的值 / 读本拍最新值"</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#222222" font-size="15" x="640" y="592"><tspan>正好对应 RTL 的<tspan fill="#E07A1F" font-weight="bold">寄存器 / 组合连线</tspan>。</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" fill="#666666" font-size="15" x="606" y="624">所以写模型的同时就把级边界写清楚了，不需要另外标。</text></g>
  <g id="footer">
    <text x="56" y="696" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#999999">curryGPU · 组会 · 2026-10-24　|　依据：fml/README.zh-CN.md；fml-rtl-proto/README.md</text>
