<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="76" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">S1 原型：用 G2 首轮那个真实错误检验 FML</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">10-23，fml-rtl-proto；三个版本：G1 单项 head、G2 两项 FIFO（有错）、G2a 两项 FIFO + 屏蔽刚发射的 warp 一拍</text>
  </g>
  <g id="exp-a">
    <rect x="56" y="124" width="372" height="524" rx="8" fill="#F4F6F9"/>
    <rect x="56" y="124" width="372" height="4" fill="#E07A1F"/>
    <text x="76" y="158" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">A · 契约挂在模型上</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="76" y="186">C2：发射时 ITS 的 PC = 被发射指令的 PC</tspan>
      <tspan x="76" y="206">（PC 是辅助字段，RTL 里没有）</tspan>
    </text>
    <text x="76" y="268" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">第 48 拍</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="76" y="298">G2 被抓到：warp 15 在 47、48 拍连发，</tspan>
      <tspan x="76" y="320">发的是 pc 2，ITS 还停在 pc 1</tspan>
    </text>
    <rect x="76" y="340" width="332" height="28" fill="#1F3A5F"/>
    <text x="88" y="359" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="bold" fill="#FFFFFF">10⁶ 拍，C2 违例次数</text>
    <text font-family="Consolas, monospace" font-size="14" fill="#222222">
      <tspan x="88" y="392">G1</tspan>
      <tspan x="88" y="418" fill="#C62828" font-weight="bold">G2</tspan>
      <tspan x="88" y="444">G2a</tspan>
    </text>
    <text font-family="Consolas, monospace" font-size="14" fill="#222222">
      <tspan x="300" y="392" fill="#2E7D32">0</tspan>
      <tspan x="300" y="418" fill="#C62828" font-weight="bold">328177</tspan>
      <tspan x="300" y="444" fill="#2E7D32">0</tspan>
    </text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="76" y="484">每次约 3 s；1 个和 8 个 worker 结果相同</tspan>
      <tspan x="76" y="520" fill="#222222" font-weight="bold">对比 RTL 那次：</tspan>
      <tspan x="76" y="542">模型构建 623 s，iadd3 端到端 PASS（漏掉）；</tspan>
      <tspan x="76" y="564">mix / control_flow 只在最后报输出不一致，</tspan>
      <tspan x="76" y="586">给不出第一条出错指令</tspan>
    </text>
    <text x="76" y="626" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#2A7F9E">另：发现手写契约 C1"隔拍发射"不精确</text>
  </g>
  <g id="exp-b">
    <rect x="454" y="124" width="372" height="524" rx="8" fill="#F4F6F9"/>
    <rect x="454" y="124" width="372" height="4" fill="#1F3A5F"/>
    <text x="474" y="158" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">B · 和 RTL 逐拍 lockstep</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="474" y="186">Verilator 记录 RTL 每拍的边界输入，回放给</tspan>
      <tspan x="474" y="206">FML 模型，逐拍比所有输出</tspan>
    </text>
    <rect x="474" y="226" width="332" height="30" fill="#1F3A5F"/>
    <text x="490" y="246" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" font-weight="bold" fill="#FFFFFF">FML \ RTL</text>
    <text x="606" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF">g1</text>
    <text x="690" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF">g2</text>
    <text x="772" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#FFFFFF">g2a</text>
    <text x="490" y="288" font-family="Consolas, monospace" font-size="13" fill="#222222">G1</text>
    <rect x="570" y="266" width="72" height="34" rx="4" fill="#2E7D32"/>
    <text x="606" y="288" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#FFFFFF">5/5 一致</text>
    <text x="690" y="288" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#C62828">10–49 拍</text>
    <text x="772" y="288" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#C62828">10–49 拍</text>
    <text x="490" y="330" font-family="Consolas, monospace" font-size="13" fill="#222222">G2</text>
    <text x="606" y="330" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#C62828">10–49 拍</text>
    <rect x="654" y="308" width="72" height="34" rx="4" fill="#2E7D32"/>
    <text x="690" y="330" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#FFFFFF">5/5 一致</text>
    <text x="772" y="330" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#C62828">14–54 拍</text>
    <text x="490" y="372" font-family="Consolas, monospace" font-size="13" fill="#222222">G2a</text>
    <text x="606" y="372" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#C62828">10–49 拍</text>
    <text x="690" y="372" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#C62828">14–54 拍</text>
    <rect x="736" y="350" width="72" height="34" rx="4" fill="#2E7D32"/>
    <text x="772" y="372" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#FFFFFF">5/5 一致</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="474" y="418">每格 5 个种子 × 20 万拍；每次约 16 万次</tspan>
      <tspan x="474" y="440">发射、3 万次 trap，含 flush 和 ctx_hold</tspan>
    </text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="474" y="484" font-weight="bold">对角线：逐拍完全一致</tspan>
      <tspan x="474" y="508">非对角线：直接报第一拍、第一个信号</tspan>
    </text>
    <rect x="474" y="526" width="332" height="40" rx="4" fill="#FFFFFF"/>
    <text x="486" y="551" font-family="Consolas, monospace" font-size="12" fill="#C62828">cycle 30: head_valid_o: model 7609, RTL 5609</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="474" y="596">差的那一位正好是被屏蔽的 warp</tspan>
      <tspan x="474" y="618" fill="#2A7F9E">原型比到逐信号；正式流程只比级边界</tspan><tspan x="474" y="636" fill="#2A7F9E">（译码数据通路未移植，RTL 作 oracle）</tspan>
    </text>
  </g>
  <g id="exp-c">
    <rect x="852" y="124" width="372" height="524" rx="8" fill="#F4F6F9"/>
    <rect x="852" y="124" width="372" height="4" fill="#2A7F9E"/>
    <text x="872" y="158" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">C · 结构规则在 IR 上查</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="872" y="186">G2 首轮的第二个毛病：refill_req 组合地</tspan>
      <tspan x="872" y="206">用了 S2 这拍的 issue_sel（违反规范）</tspan>
    </text>
    <rect x="872" y="226" width="332" height="118" rx="6" fill="#FFFFFF"/>
    <text x="888" y="252" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#222222">写法 1：S1 输出放一个 task</text>
    <text x="888" y="278" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#C62828">FML 加载时直接拒绝：</text>
    <text font-family="Consolas, monospace" font-size="12" fill="#C62828">
      <tspan x="888" y="302">dependency cycle</tspan>
      <tspan x="888" y="322">S1.view → S2.pick → S1.view</tspan>
    </text>
    <rect x="872" y="356" width="332" height="118" rx="6" fill="#FFFFFF"/>
    <text x="888" y="382" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#222222">写法 2：拆成两个 task（同 RTL 连法）</text>
    <text x="888" y="408" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#222222">能加载；40 行规则脚本报出：</text>
    <text font-family="Consolas, monospace" font-size="12" fill="#C62828">
      <tspan x="888" y="432">VIOLATION view_refill drives</tspan>
      <tspan x="888" y="452">ib_req from S2.issue ('latest)</tspan>
    </text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="872" y="504">G1 / G2 / G2a 正常闭环：0 违例</tspan>
      <tspan x="872" y="540" fill="#222222" font-weight="bold">说明：</tspan>
      <tspan x="872" y="562">内建检查是 task 粒度的组合环检查，</tspan>
      <tspan x="872" y="584">无关输出放一个 task 会误报；"反向必须</tspan>
      <tspan x="872" y="606">过寄存器"要另写规则，但 IR 里信息齐全</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · 组会 · 2026-10-24　|　依据：fml-rtl-proto/README.md；runs/lockstep-matrix.txt</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">17</text>
  </g>
</svg>
