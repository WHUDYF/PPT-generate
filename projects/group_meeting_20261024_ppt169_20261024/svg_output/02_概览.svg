<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F3A5F"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="76" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">今天讲的一条线：从"对照图重构"到"流程化"</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">两周的重构做完了一轮，暴露出流程上的问题；用 FML 做中间 IR 是我们想到的解法，S1 原型已经跑通</text>
  </g>
  <g id="step-1">
    <rect x="56" y="128" width="266" height="300" rx="8" fill="#F4F6F9"/>
    <rect x="56" y="128" width="266" height="4" fill="#1F3A5F"/>
    <text x="76" y="164" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#E07A1F">01 · 怎么做的</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#222222">
      <tspan x="76" y="198">先画 drawio 目标图，</tspan>
      <tspan x="76" y="224">AI 对照图逐条改 RTL</tspan>
    </text>
    <text x="76" y="300" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#1F3A5F">130</text>
    <text x="76" y="326" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">个提交，每个都过三道检查</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#999999">
      <tspan x="76" y="380">修改清单 63 条，已关闭 23 条</tspan>
      <tspan x="76" y="402">第 3–5 页</tspan>
    </text>
  </g>
  <line x1="324" y1="278" x2="350" y2="278" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrP)"/>
  <g id="step-2">
    <rect x="356" y="128" width="266" height="300" rx="8" fill="#F4F6F9"/>
    <rect x="356" y="128" width="266" height="4" fill="#1F3A5F"/>
    <text x="376" y="164" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#E07A1F">02 · 区别与优势</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#222222">
      <tspan x="376" y="198">一级一个模块，边界寄存，</tspan>
      <tspan x="376" y="224">反向只走事件</tspan>
    </text>
    <text x="376" y="300" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">−43%</text>
    <text x="376" y="326" font-family="Consolas, monospace" font-size="14" fill="#666666">subcore_top 6169 → 3486 行</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#999999">
      <tspan x="376" y="380">结构检查六级 0 不一致；周期不变差</tspan>
      <tspan x="376" y="402">第 6–10 页</tspan>
    </text>
  </g>
  <line x1="624" y1="278" x2="650" y2="278" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrP)"/>
  <g id="step-3">
    <rect x="656" y="128" width="266" height="300" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.5"/>
    <text x="676" y="164" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#C62828">03 · 痛点</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#222222">
      <tspan x="676" y="198">图不能执行，时序契约</tspan>
      <tspan x="676" y="224">没有载体</tspan>
    </text>
    <text x="676" y="300" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#C62828">6</text>
    <text x="676" y="326" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">个功能全过、问题照样漏掉的案例</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#999999">
      <tspan x="676" y="380">30 条设计决定是写 RTL 时才冒出来的</tspan>
      <tspan x="676" y="402">第 11–12 页</tspan>
    </text>
  </g>
  <line x1="924" y1="278" x2="950" y2="278" stroke="#1F3A5F" stroke-width="2" marker-end="url(#arrP)"/>
  <g id="step-4">
    <rect x="956" y="128" width="268" height="300" rx="8" fill="#1F3A5F"/>
    <text x="976" y="164" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#E07A1F">04 · 方案</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#FFFFFF">
      <tspan x="976" y="198">FML 可执行模型作中间 IR，</tspan>
      <tspan x="976" y="224">RTL 与它逐拍比对</tspan>
    </text>
    <text x="976" y="300" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">第 48 拍</text>
    <text x="976" y="326" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#FFFFFF">S1 原型上抓到 G2 错误，1 秒内</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#FFFFFF" fill-opacity="0.7">
      <tspan x="976" y="380">RTL 端到端当时判 PASS</tspan>
      <tspan x="976" y="402">第 13–19 页</tspan>
    </text>
  </g>
  <g id="thesis">
    <rect x="56" y="456" width="1168" height="192" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="80" y="480" width="28" height="28" fill="#E07A1F" stroke-width="2"/>
    <text x="122" y="501" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#1F3A5F">一句话</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#222222">
      <tspan x="80" y="544">现在的"标准"是一张 drawio 图，它只说<tspan fill="#1F3A5F" font-weight="bold">有什么、怎么连</tspan>，不说<tspan fill="#C62828" font-weight="bold">每一拍做什么</tspan>；</tspan>
      <tspan x="80" y="578">把标准换成一个能跑、能和 RTL 逐拍比的 FML 模型，图、约束清单、契约都从它派生，</tspan>
      <tspan x="80" y="612">AI 写 RTL 的每一步就都有了可以机械判定的验收依据。</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · 组会 · 2026-10-24</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">2</text>
  </g>
</svg>
