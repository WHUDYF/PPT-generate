<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="46" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="76" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">想请大家讨论的问题，以及下一步</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">左边需要老师和同学给意见；右边是接下来两周的安排</text>
  </g>
  <g id="questions">
    <rect x="56" y="122" width="600" height="526" rx="8" fill="#F4F6F9"/>
    <use data-icon="tabler-outline/message-question" x="76" y="140" width="26" height="26" fill="#E07A1F" stroke-width="2"/>
    <text x="112" y="159" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">讨论</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="76" y="202" font-weight="bold"><tspan fill="#E07A1F">1</tspan>　FML 当中间 IR 合不合适</tspan>
      <tspan x="100" y="226" font-size="14" fill="#666666">对比 Chisel / SystemC / 继续用 Python 结构数据：</tspan>
      <tspan x="100" y="248" font-size="14" fill="#666666">我们看重的是"读法即寄存器 / 连线"和加载时检查</tspan>
      <tspan x="76" y="290" font-weight="bold"><tspan fill="#E07A1F">2</tspan>　FML 规格和性能模型怎么分工</tspan>
      <tspan x="100" y="314" font-size="14" fill="#666666">倾向不合一：模型管多少拍，FML 管每级状态和级间传输</tspan>
      <tspan x="76" y="356" font-weight="bold"><tspan fill="#E07A1F">3</tspan>　边界事务怎么定义</tspan>
      <tspan x="100" y="380" font-size="14" fill="#666666">比每拍的边界信号，还是比事务序列？S4 这类级怎么写</tspan>
      <tspan x="76" y="422" font-weight="bold"><tspan fill="#E07A1F">4</tspan>　模型和 RTL 都由 AI 写，怎么防同错</tspan>
      <tspan x="100" y="446" font-size="14" fill="#666666">模型由人审（审派生出来的图），数值语义以实卡为准</tspan>
      <tspan x="76" y="488" font-weight="bold"><tspan fill="#E07A1F">5</tspan>　论文定位与投稿形式</tspan>
      <tspan x="100" y="512" font-size="14" fill="#666666">"验收 + 逃逸分析"能否站住；先投短文还是等主实验</tspan>
      <tspan x="76" y="554" font-weight="bold"><tspan fill="#E07A1F">6</tspan>　外部案例</tspan>
      <tspan x="100" y="578" font-size="14" fill="#666666">只有一个设计且 RTL 全由 AI 写；XiangShan 后端</tspan>
      <tspan x="100" y="600" font-size="14" fill="#666666">+ difftest 是否足够</tspan>
    </text>
  </g>
  <g id="next-rtl">
    <rect x="680" y="122" width="544" height="214" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <use data-icon="tabler-outline/cpu" x="700" y="140" width="26" height="26" fill="#1F3A5F" stroke-width="2"/>
    <text x="736" y="159" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">RTL 重构（继续按现流程）</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="700" y="196"><tspan font-weight="bold" fill="#E07A1F">①</tspan> E15 批次：redirect 归 S2，控制前门 + ITS 收尾</tspan>
      <tspan x="700" y="228"><tspan font-weight="bold" fill="#E07A1F">②</tspan> 清掉 S1–SW 剩下的偏差；常量前门 fd_const</tspan>
      <tspan x="700" y="260"><tspan font-weight="bold" fill="#E07A1F">③</tspan> 补覆盖：多 warp MEMBAR / ERRBAR、防饿死触发</tspan>
      <tspan x="700" y="292"><tspan font-weight="bold" fill="#E07A1F">④</tspan> 最后：S0 搬迁、E22 同 warp 背靠背发射</tspan>
      <tspan x="700" y="320" font-size="13" fill="#666666">E15 和 E22 都牵涉 ITS，适合作 FML 阶段 1 的第一个用户</tspan>
    </text>
  </g>
  <g id="next-fml">
    <rect x="680" y="352" width="544" height="296" rx="8" fill="#FFFFFF" stroke="#E07A1F" stroke-width="2"/>
    <use data-icon="tabler-outline/file-code" x="700" y="370" width="26" height="26" fill="#E07A1F" stroke-width="2"/>
    <text x="736" y="389" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">FML 方案（阶段 1）</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="700" y="426"><tspan font-weight="bold" fill="#2A7F9E">①</tspan> 写下"可落 RTL 子集"规则：view / commit、</tspan>
      <tspan x="724" y="448">位宽、级注解、ghost 标记，做成检查脚本</tspan>
      <tspan x="700" y="482"><tspan font-weight="bold" fill="#2A7F9E">②</tspan> S2（含 ITS）写成边界规格，用真实 kernel</tspan>
      <tspan x="724" y="504">的边界 trace 和当前 RTL lockstep</tspan>
      <tspan x="700" y="538"><tspan font-weight="bold" fill="#2A7F9E">③</tspan> 把 E22、ev_complete、credit 写成第一批契约</tspan>
      <tspan x="700" y="572"><tspan font-weight="bold" fill="#2A7F9E">④</tspan> 在 A8 上回放：契约能否直接指出</tspan>
      <tspan x="724" y="594">"WARPSYNC 分叉 9 拍"</tspan>
      <tspan x="700" y="628" font-size="13" fill="#666666">研究线同步：系统整理逃逸案例，做"需求 → 检查"覆盖表</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · 组会 · 2026-10-24　|　谢谢！</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">22</text>
  </g>
</svg>
