<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <g id="header">
    <rect x="56" y="44" width="6" height="40" fill="#1F3A5F" />
    <text x="76" y="76" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">今天讲什么</text>
    <path fill="#F4F6F9" d="M1048,40 H1216 A8,8 0 0 1 1224,48 V96 A8,8 0 0 1 1216,104 H1048 A8,8 0 0 1 1040,96 V48 A8,8 0 0 1 1048,40 Z" />
    <text x="1132" y="72" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#E07A1F">≈25<tspan font-size="16" fill="#666666"> 分钟</tspan></text>
    <text x="1132" y="94" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#666666">23 页</text>
    <line x1="56" y1="128" x2="1224" y2="128" stroke="#D8DEE6" stroke-width="1" />
  </g>
  <g id="rail">
    <line x1="112" y1="176" x2="112" y2="626" stroke="#D8DEE6" stroke-width="3" />
  </g>
  <g id="item-01">
    <circle cx="112" cy="176" r="22" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3" />
    <text x="112" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1F3A5F">01</text>
    <text x="160" y="172" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">背景：性能模型的结构</text>
    <text x="160" y="198" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">它怎么算一条指令，为什么照它生成的 RTL 流水线会混乱</text>
    <text x="1224" y="182" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#999999">3 分钟</text>
  </g>
  <g id="item-02">
    <circle cx="112" cy="266" r="22" fill="#1F3A5F" />
    <text x="112" y="272" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#FFFFFF">02</text>
    <text x="160" y="262" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">subcore 目标结构</text>
    <text x="160" y="288" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">大流水线套小流水线；S0 到 SW 每一级想做什么、内部怎么做</text>
    <text x="1224" y="272" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#E07A1F" font-weight="bold">9 分钟</text>
  </g>
  <g id="item-03">
    <circle cx="112" cy="356" r="22" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3" />
    <text x="112" y="362" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1F3A5F">03</text>
    <text x="160" y="352" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">怎么验证改完的 RTL</text>
    <text x="160" y="378" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">用例、比较方法、可重复的工件；目前的结果和发现</text>
    <text x="1224" y="362" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#999999">3 分钟</text>
  </g>
  <g id="item-04">
    <circle cx="112" cy="446" r="22" fill="#1F3A5F" />
    <text x="112" y="452" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#FFFFFF">04</text>
    <text x="160" y="442" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">AI 生成 RTL 的观察</text>
    <text x="160" y="468" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">8 条带实例的观察，有效的做法，研究框架</text>
    <text x="1224" y="452" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#E07A1F" font-weight="bold">3 分钟</text>
  </g>
  <g id="item-05">
    <circle cx="112" cy="536" r="22" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3" />
    <text x="112" y="542" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#1F3A5F">05</text>
    <text x="160" y="532" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">用 AI 写代码：humanize</text>
    <text x="160" y="558" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">从想法到计划，再到"实现 + 独立评审"的循环；两个真实示例和上手步骤</text>
    <text x="1224" y="542" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#999999">6 分钟</text>
  </g>
  <g id="item-06">
    <circle cx="112" cy="626" r="22" fill="#1F3A5F" />
    <text x="112" y="632" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#FFFFFF">06</text>
    <text x="160" y="622" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">下一步</text>
    <text x="160" y="648" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">先出一版重构后的 RTL，对比手改与模型生成的差别，再讨论怎么交给 AI</text>
    <text x="1224" y="632" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#E07A1F" font-weight="bold">1 分钟</text>
  </g>
</svg>