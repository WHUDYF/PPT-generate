      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222" x="664" y="448">原因在 runtime 而不在 RTL：引擎线程每片推进 4096 拍，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222" x="664" y="472">下一个 CUDA 请求落在哪一片边界取决于 OS 调度</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#222222" x="664" y="504"><tspan>处理：<tspan font-family="Consolas, monospace" fill="#E07A1F" font-weight="bold">CURRYGPU_LOCKSTEP=1</tspan>，等待者自己推进模拟器</tspan>
