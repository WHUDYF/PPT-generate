    <path d="M150 428 L156 418 L162 428 Z" fill="#C62828" />
    <text x="516" y="466" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#C62828">有问题：评审意见写进 round-(N+1)-prompt.md，实现者继续</text>
  </g>
