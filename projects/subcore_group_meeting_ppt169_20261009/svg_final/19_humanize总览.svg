  <g id="loop">
    <text x="56" y="330" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">RLCR 一轮怎么走</text>
    <path fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5" d="M64,346 H248 A8,8 0 0 1 256,354 V410 A8,8 0 0 1 248,418 H64 A8,8 0 0 1 56,410 V354 A8,8 0 0 1 64,346 Z" />
