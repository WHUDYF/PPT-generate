    <text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="474" y="556">退出由 hook 判断：要求 summary 存在、</text><text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="474" y="578">工作区干净、没有未完成任务</text><text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="474" y="606">不许手改状态文件或自己跑取消脚本</text><path fill="#F4F6F9" d="M860,490 H1216 A8,8 0 0 1 1224,498 V636 A8,8 0 0 1 1216,644 H860 A8,8 0 0 1 852,636 V498 A8,8 0 0 1 860,490 Z" />
    
