    <path d="M764 376 L774 382 L764 388 Z" fill="#1F3A5F" />
    <path fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5" d="M784,346 H968 A8,8 0 0 1 976,354 V410 A8,8 0 0 1 968,418 H784 A8,8 0 0 1 776,410 V354 A8,8 0 0 1 784,346 Z" />
    <text x="876" y="376" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#222222">评审者（另一模型）</text>
    <text x="876" y="400" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#666666">对照计划和代码挑问题</text>
    <path d="M976 382 L1004 382" stroke="#1F3A5F" stroke-width="2" />
    <path d="M1004 376 L1014 382 L1004 388 Z" fill="#1F3A5F" />
    <path fill="#2E7D32" d="M1024,346 H1216 A8,8 0 0 1 1224,354 V410 A8,8 0 0 1 1216,418 H1024 A8,8 0 0 1 1016,410 V354 A8,8 0 0 1 1024,346 Z" />
