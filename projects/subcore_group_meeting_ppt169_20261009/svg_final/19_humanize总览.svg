    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">装在 Codex / Claude Code 上的一组 skill；核心是 RLCR 循环（Ralph-Loop with Codex Review）</text>
  </g>
