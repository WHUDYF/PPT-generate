    <text x="76" y="74" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">一个握手模板 + 三条边界规则，S2 是唯一的单拍环</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">7 个大级每拍并行，各自处理不同 warp；大级内部照公司 DSP 设计 DSP.v 的任务流水线写法</text>
  </g>
