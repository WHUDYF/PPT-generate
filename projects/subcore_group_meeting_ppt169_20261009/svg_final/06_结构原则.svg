    <path d="M14 3v2" />
    <path d="M21 10h-2" />
    <path d="M21 14h-2" />
    <path d="M14 21v-2" />
    <path d="M10 21v-2" />
  </g>
    <text x="108" y="630" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222"><tspan font-weight="bold">一大级一模块</tspan> subcore_&lt;级名&gt;，subcore_top 只做连接</text>
  </g>
  <g id="boundary-rules">
    <text x="640" y="226" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F">三条边界规则</text>
    <circle cx="656" cy="264" r="14" fill="#1F3A5F" />
    <text x="656" y="269" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="682" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#222222">向前只走寄存器（<tspan font-family="Consolas, monospace">vld</tspan> + 已寄存的 payload）</text>
    <circle cx="656" cy="304" r="14" fill="#1F3A5F" />
    <text x="656" y="309" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="682" y="310" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#222222">向后只走已寄存的事件通道，目的级 <tspan fill="#E07A1F" font-weight="bold">+1 拍</tspan>看到</text>
    <circle cx="656" cy="344" r="14" fill="#1F3A5F" />
    <text x="656" y="349" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="682" y="350" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#222222">每份状态只有一个主人，只有主人能写</text>
  </g>
