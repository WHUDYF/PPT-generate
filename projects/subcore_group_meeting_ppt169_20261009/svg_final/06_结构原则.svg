  <g id="handshake-template">
    <text x="56" y="226" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F3A5F">小级握手模板（取自 DSP.v）</text>
    <rect x="56" y="242" width="540" height="40" fill="#1F3A5F" />
    <text x="76" y="268" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">信号</text>
    <text x="276" y="268" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">定义</text>
    <text x="76" y="314" font-family="Consolas, monospace" font-size="17" fill="#222222">rdy_sN</text>
    <text x="276" y="314" font-family="Consolas, monospace" font-size="17" fill="#222222">ena_s(N+1)</text>
    <line x1="56" y1="330" x2="596" y2="330" stroke="#D8DEE6" stroke-width="1" />
    <text x="76" y="360" font-family="Consolas, monospace" font-size="17" fill="#222222">handshake_sN</text>
    <text x="276" y="360" font-family="Consolas, monospace" font-size="17" fill="#222222">rdy &amp; vld</text>
    <line x1="56" y1="376" x2="596" y2="376" stroke="#D8DEE6" stroke-width="1" />
    <text x="76" y="406" font-family="Consolas, monospace" font-size="17" fill="#222222">ena_sN</text>
    <text x="276" y="406" font-family="Consolas, monospace" font-size="17" fill="#222222">handshake | ~vld</text>
    <line x1="56" y1="422" x2="596" y2="422" stroke="#D8DEE6" stroke-width="1" />
    <text x="76" y="452" font-family="Consolas, monospace" font-size="17" fill="#222222">vld_sN</text>
    <text x="276" y="452" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#222222">寄存器</text>
    <line x1="56" y1="468" x2="596" y2="468" stroke="#D8DEE6" stroke-width="1" />
    <text x="76" y="498" font-family="Consolas, monospace" font-size="17" fill="#222222">x_sN</text>
    <text x="276" y="498" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" fill="#222222">在上游握手时采样</text>
    <line x1="56" y1="514" x2="596" y2="514" stroke="#D8DEE6" stroke-width="1" />
    <text font-size="14" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="56" y="548">与 DSP 的区别：DSP 外层是互斥的任务 FSM，subcore 外层没有。</text><text font-size="14" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="56" y="572">FSM 只用在"一次做一件、要做多拍"的单元：SFU、XLANE、分支序列、上下文切换。</text><path fill="#F4F6F9" d="M64,596 H588 A8,8 0 0 1 596,604 V644 A8,8 0 0 1 588,652 H64 A8,8 0 0 1 56,644 V604 A8,8 0 0 1 64,596 Z" />
    
  <g transform="translate(72.0, 612.0)" fill="none" stroke="#1F3A5F" stroke-width="2">
    <path d="M5 6a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -12" />
    <path d="M9 9h6v6h-6l0 -6" />
    <path d="M3 10h2" />
    <path d="M3 14h2" />
