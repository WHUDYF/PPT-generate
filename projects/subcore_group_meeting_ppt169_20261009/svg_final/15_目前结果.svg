    <text font-size="14" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="72" y="414">原版单项 head，同一 warp 本来就隔拍发射；</text><text font-size="14" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="72" y="438">ITS 的 PC 推进、分支信息都依赖这一拍空档。</text><text font-size="14" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="72" y="462">波形上看到 warp 0 连续两拍发射，ITS 选中的</text><text font-size="14" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="72" y="486">PC 却都是 8，说明 PC 推进晚了一拍。</text><text font-size="14" fill="#222222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="72" y="518">处理：这一步先屏蔽 1 拍保持原时序，</text><text font-size="14" fill="#222222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="72" y="540">放开连续发射推迟到第 3 步 S2 重构之后</text></g>
