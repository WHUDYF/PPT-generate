    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222" x="876" y="214" font-weight="bold">A　拉长流水线是否接受？</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666" x="900" y="238">发射到写回变长，stall 数要加大，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666" x="900" y="258">单 warp 依赖链会变慢（待定 F）</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222" x="876" y="300" font-weight="bold">B　单 warp 取指 0.67 条/拍</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666" x="900" y="324">要不要补？</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222" x="876" y="366" font-weight="bold">C　分支 FSM 的粒度</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666" x="900" y="390">整个 subcore 一个，还是每 warp 一个</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#222222" x="876" y="432" font-weight="bold">D　AI 实验的第一个模块</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666" x="900" y="456">按四种条件生成，把今天的 8 条</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#666666" x="900" y="476">观察补成 D 记录</text><path fill="#1F3A5F" d="M882,560 H1198 A6,6 0 0 1 1204,566 V618 A6,6 0 0 1 1198,624 H882 A6,6 0 0 1 876,618 V566 A6,6 0 0 1 882,560 Z" />
