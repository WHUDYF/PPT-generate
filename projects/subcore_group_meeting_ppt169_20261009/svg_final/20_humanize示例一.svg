    <text x="110" y="164" font-family="Consolas, monospace" font-size="16" font-weight="bold" fill="#1F3A5F">$humanize-gen-idea "&lt;想法&gt;"</text>
    <text x="76" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#999999">输入（原话，一句）</text>
    <path fill="#FFFFFF" d="M82,210 H590 A6,6 0 0 1 596,216 V260 A6,6 0 0 1 590,266 H82 A6,6 0 0 1 76,260 V216 A6,6 0 0 1 82,210 Z" />
    <text font-size="14" fill="#222222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="92" y="234">"他们是如何将 Fusion / 模板选择纳入</text><text font-size="14" fill="#222222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="92" y="254">软硬件协同优化的？"</text><text x="76" y="296" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#999999">输出：150 行草稿，6 个方向，1 个主方案 + 5 个备选</text>
    <path fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5" d="M82,306 H590 A6,6 0 0 1 596,312 V394 A6,6 0 0 1 590,400 H82 A6,6 0 0 1 76,394 V312 A6,6 0 0 1 82,306 Z" />
    <text x="92" y="330" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3A5F">主方向：Hierarchical Joint Search</text>
    <text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="92" y="354">外层搜硬件 × Fusion × 模板，内层对每个组合求最优 mapping；</text><text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="92" y="376">对照 FAST、CASCO、HASCO 三篇的做法</text><text x="76" y="430" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#999999">每条判断都要落到仓库里的证据，例如</text>
    <text font-size="12" fill="#2A7F9E" font-family="Consolas, monospace" x="76" y="456">mlir_lowering.py:180-189</text><text font-size="12" fill="#2A7F9E" font-family="Consolas, monospace" x="76" y="500">route4_fusion_pilot/conv_codesign_analysis.json</text><text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="76" y="476">按固定优先级只选一个 Conv 模板，没有比较周期</text><text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="76" y="520">Fusion 加速比随硬件在 4.83× 到 6.90× 之间变化</text><path fill="#FFFFFF" stroke="#E07A1F" stroke-width="1.5" d="M82,544 H590 A6,6 0 0 1 596,550 V618 A6,6 0 0 1 590,624 H82 A6,6 0 0 1 76,618 V550 A6,6 0 0 1 82,544 Z" />
    <text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="92" y="570">规则：找不到证据就写 "exploratory, no concrete</text><text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="92" y="592">precedent"，不许编路径和数据；</text><text font-size="13" fill="#666666" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" x="92" y="614">这一步只写草稿，不改任何代码</text></g>
