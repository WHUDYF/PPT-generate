    <text x="76" y="74" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1F3A5F">示例一：从一句话到一份可验收的计划</text>
    <text x="76" y="104" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#666666">左：PyTorchSim 上的 gen-idea 草稿（2026-07-20）；右：trace 压缩项目里按 gen-plan 格式写的计划（2026-05-08）</text>
  </g>
  <g id="idea">
    <path fill="#F4F6F9" d="M64,128 H608 A8,8 0 0 1 616,136 V636 A8,8 0 0 1 608,644 H64 A8,8 0 0 1 56,636 V136 A8,8 0 0 1 64,128 Z" />
    
  <g transform="translate(76.0, 146.0)" fill="none" stroke="#E07A1F" stroke-width="2">
