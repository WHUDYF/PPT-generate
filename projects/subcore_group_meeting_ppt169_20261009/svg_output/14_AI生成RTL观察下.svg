<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">结论要可追溯，机制要找已有的，测量要先可信</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">观察 5–8</text>
  </g>
  <g id="obs-5">
    <rect x="56" y="128" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="76" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">05</text>
    <text x="120" y="162" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">AI 也会讲错</text>
    <text x="120" y="186" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">ordering</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="76" y="222">讲 MEMBAR 时说 GPU 范围在 SM 层"Drain 等 load 排空"，</tspan>
      <tspan x="76" y="244">错：<tspan font-family="Consolas, monospace" fill="#222222">sm_membar_ctl.v:121-123</tspan> 直接转 Fence，在途</tspan>
      <tspan x="76" y="266">load 由其后的 ERRBAR 等。S1 head 一天内 2 项→1 项→2 项。</tspan>
    </text>
    <line x1="76" y1="292" x2="608" y2="292" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="76" y="306" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="104" y="322">结论带依据（RTL 行号、模型代码行），</tspan>
      <tspan x="104" y="346">才能<tspan font-weight="bold" fill="#1F3A5F">快速推翻或确认</tspan></tspan>
    </text>
  </g>
  <g id="obs-6">
    <rect x="652" y="128" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="672" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">06</text>
    <text x="716" y="162" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">抽象层次比细节更重要</text>
    <text x="716" y="186" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">structure</text>
    <text x="672" y="222" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">S2 挡发射的位，换了三版抽象：</text>
    <rect x="672" y="236" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="747" y="258" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#999999" text-decoration="line-through">两层 FSM</text>
    <text x="834" y="258" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#999999">→</text>
    <rect x="852" y="236" width="160" height="34" rx="4" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="932" y="258" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#999999" text-decoration="line-through">生命周期 + hold 表</text>
    <text x="1024" y="258" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#999999">→</text>
    <rect x="1042" y="236" width="162" height="34" rx="4" fill="#1F3A5F"/>
    <text x="1123" y="258" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="bold" fill="#FFFFFF">显式 SB + 隐式 SB</text>
    <text x="672" y="284" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">原版这些位本来就是"发射置位、事件清除"，和 SB 同一模式</text>
    <line x1="672" y1="296" x2="1204" y2="296" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="672" y="310" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="700" y="326">先在现有代码里<tspan font-weight="bold" fill="#1F3A5F">找已有的统一机制</tspan>并命名，</tspan>
      <tspan x="700" y="350">不要另造一套抽象</tspan>
    </text>
  </g>
  <g id="obs-7">
    <rect x="56" y="396" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="76" y="432" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">07</text>
    <text x="120" y="430" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">测量基础设施本身可能不确定</text>
    <text x="120" y="454" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">验证方法</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="76" y="490">d1 第一次比对出现差异，查下来是 runtime 线程调度</tspan>
      <tspan x="76" y="512">引起的，与 RTL 无关；同一二进制两次运行的拍数</tspan>
      <tspan x="76" y="534">就不一样。</tspan>
    </text>
    <line x1="76" y1="560" x2="608" y2="560" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="76" y="574" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="104" y="590">A/B 之前先确认<tspan font-weight="bold" fill="#1F3A5F">同一二进制重复跑一致</tspan>，</tspan>
      <tspan x="104" y="614">否则差异无法归因到 RTL</tspan>
    </text>
  </g>
  <g id="obs-8">
    <rect x="652" y="396" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="672" y="432" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">08</text>
    <text x="716" y="430" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">死逻辑与静默挂起，读比跑更易发现</text>
    <text x="716" y="454" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">structure</text>
    <text font-family="Consolas, monospace" font-size="13" fill="#222222">
      <tspan x="672" y="490">head_const_tag_hit ≡ 1</tspan>
      <tspan x="672" y="512">trap_reserved_barrier_slot_o → unused</tspan>
      <tspan x="672" y="534">selection_changed_o 悬空 · guard_capture_q 死寄存器</tspan>
    </text>
    <line x1="672" y1="560" x2="1204" y2="560" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="672" y="574" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="700" y="590">回归测不出来，要靠"<tspan font-weight="bold" fill="#1F3A5F">状态有没有主人</tspan>"</tspan>
      <tspan x="700" y="614">这类结构规则来暴露</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · subcore 组会 · 2026-10-10</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">14</text>
  </g>
</svg>
