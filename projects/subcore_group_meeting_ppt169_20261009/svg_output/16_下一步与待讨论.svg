<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">下一步：先做完保持行为的整理，再动拍数</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">会改拍数的结构改动只能用端到端用例验证，所以放在后面</text>
  </g>
  <g id="col-near">
    <rect x="56" y="128" width="368" height="516" rx="8" fill="#F4F6F9"/>
    <rect x="56" y="128" width="368" height="4" fill="#E07A1F"/>
    <use data-icon="tabler-outline/checks" x="76" y="150" width="24" height="24" fill="#E07A1F" stroke-width="2"/>
    <text x="108" y="169" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">近期 · 保持行为</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="76" y="214" font-weight="bold">1　提交 d1</tspan>
      <tspan x="100" y="238" font-size="14" fill="#666666">补 wave_compare 与 sm_context，</tspan>
      <tspan x="100" y="258" font-size="14" fill="#666666">更新断言里的层级路径</tspan>
      <tspan x="76" y="300" font-weight="bold">2　d2</tspan>
      <tspan x="100" y="324" font-size="14" fill="#666666">分支 / CONV 序列（约 1100 行）和</tspan>
      <tspan x="100" y="344" font-size="14" fill="#666666">its_top 搬进 subcore_issue</tspan>
      <tspan x="76" y="386" font-weight="bold">3　定 ctx 保存格式</tspan>
      <tspan x="100" y="410" font-size="14" fill="#666666">建议 A：按子模块各自拼接，</tspan>
      <tspan x="100" y="430" font-size="14" fill="#666666">用 sm_context 往返测试验证</tspan>
      <tspan x="76" y="472" font-weight="bold">4　S2-e</tspan>
      <tspan x="100" y="496" font-size="14" fill="#666666">payload 译码挪到 S3；</tspan>
      <tspan x="100" y="516" font-size="14" fill="#666666">端口按"源+目的"统一改名</tspan>
    </text>
  </g>
  <g id="col-timing">
    <rect x="456" y="128" width="368" height="516" rx="8" fill="#F4F6F9"/>
    <rect x="456" y="128" width="368" height="4" fill="#2A7F9E"/>
    <use data-icon="tabler-outline/timeline" x="476" y="150" width="24" height="24" fill="#2A7F9E" stroke-width="2"/>
    <text x="508" y="169" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">之后 · 会改拍数</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="476" y="214" font-weight="bold">5　S2 到 S4 一起重构</tspan>
      <tspan x="500" y="238" font-size="14" fill="#666666">两者必须同时做，否则会同拍</tspan>
      <tspan x="500" y="258" font-size="14" fill="#666666">写同一写口</tspan>
      <tspan x="476" y="300" font-weight="bold">6　S1 改为 2 项 head FIFO</tspan>
      <tspan x="476" y="342" font-weight="bold">7　ev_complete 改为 +1 拍</tspan>
      <tspan x="500" y="366" font-size="14" fill="#666666">在访存密集用例上量代价，</tspan>
      <tspan x="500" y="386" font-size="14" fill="#666666">同步改性能模型</tspan>
      <tspan x="476" y="428" font-weight="bold">8　MEMBAR 协议位拆到访存侧</tspan>
      <tspan x="500" y="452" font-size="14" fill="#666666">代价：放行晚 1 拍</tspan>
      <tspan x="476" y="494" font-weight="bold">9　S0 三级、L0I 数据进 SRAM</tspan>
    </text>
  </g>
  <g id="col-discuss">
    <rect x="856" y="128" width="368" height="516" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2"/>
    <use data-icon="tabler-outline/help" x="876" y="150" width="24" height="24" fill="#1F3A5F" stroke-width="2"/>
    <text x="908" y="169" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#1F3A5F">想请大家一起判断</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="876" y="214" font-weight="bold">A　拉长流水线是否接受？</tspan>
      <tspan x="900" y="238" font-size="14" fill="#666666">发射到写回变长，stall 数要加大，</tspan>
      <tspan x="900" y="258" font-size="14" fill="#666666">单 warp 依赖链会变慢（待定 F）</tspan>
      <tspan x="876" y="300" font-weight="bold">B　单 warp 取指 0.67 条/拍</tspan>
      <tspan x="900" y="324" font-size="14" fill="#666666">要不要补？</tspan>
      <tspan x="876" y="366" font-weight="bold">C　分支 FSM 的粒度</tspan>
      <tspan x="900" y="390" font-size="14" fill="#666666">整个 subcore 一个，还是每 warp 一个</tspan>
      <tspan x="876" y="432" font-weight="bold">D　AI 实验的第一个模块</tspan>
      <tspan x="900" y="456" font-size="14" fill="#666666">按四种条件生成，把今天的 8 条</tspan>
      <tspan x="900" y="476" font-size="14" fill="#666666">观察补成 D 记录</tspan>
    </text>
    <rect x="876" y="560" width="328" height="64" rx="6" fill="#1F3A5F"/>
    <text x="1040" y="588" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#FFFFFF">谢谢，欢迎讨论</text>
    <text x="1040" y="610" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.7">dyf · curryGPU</text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · subcore 组会 · 2026-10-10</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">16</text>
  </g>
</svg>
