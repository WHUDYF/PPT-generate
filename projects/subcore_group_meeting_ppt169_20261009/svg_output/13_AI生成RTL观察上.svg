<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">AI 生成 RTL 缺的不是细节，而是"结构"这一层</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">观察 1–4：来自这一周整理 RTL 的实例，括号内为缺陷根因类别</text>
  </g>
  <g id="obs-1">
    <rect x="56" y="128" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="76" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">01</text>
    <text x="120" y="162" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">性能模型缺一层结构</text>
    <text x="120" y="186" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">abstraction-gap / structure</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="76" y="222">模型把 eligible → … → dispatch 当成一个事件，写口</tspan>
      <tspan x="76" y="244">预约放在发射时、不算读冲突。照着它生成的 RTL 就在</tspan>
      <tspan x="76" y="266">S2 组合读后级信号；IntAdd（tap 6）不在写回检查里。</tspan>
    </text>
    <line x1="76" y1="292" x2="608" y2="292" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="76" y="306" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="104" y="322">生成前先给出"哪些逻辑在哪一级、级间寄存器</tspan>
      <tspan x="104" y="346">是什么"——<tspan font-weight="bold" fill="#1F3A5F">光有模型不够</tspan></tspan>
    </text>
  </g>
  <g id="obs-2">
    <rect x="652" y="128" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="672" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">02</text>
    <text x="716" y="162" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">风格脚本不保证行为不变</text>
    <text x="716" y="186" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">style</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="672" y="222">PR #38 最后一个提交 <tspan font-family="Consolas, monospace" fill="#222222">872e78e2</tspan> 把 ifetch_ib 的</tspan>
      <tspan x="672" y="244">next_deadline 改成 if/else 链：分支里读未赋值的自身，</tspan>
      <tspan x="672" y="266"><tspan fill="#C62828">形成组合环</tspan>；同拍 push + pop 漏掉了 pop 的减法。</tspan>
    </text>
    <line x1="672" y1="292" x2="1204" y2="292" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="672" y="306" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="700" y="322">任何"只改写法"的提交都要做<tspan font-weight="bold" fill="#1F3A5F">等价性检查</tspan></tspan>
      <tspan x="700" y="346">——这正是逐信号比对的理由</tspan>
    </text>
  </g>
  <g id="obs-3">
    <rect x="56" y="396" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="76" y="432" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">03</text>
    <text x="120" y="430" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">契约从代码里读出来，会推翻计划</text>
    <text x="120" y="454" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">验证计划</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="76" y="490">IADD3 链的依赖完全由 stall count 保证，不产生 SB 流量，</tspan>
      <tspan x="76" y="512">原定"用 IADD3 依赖链验证 SB 环"根本测不到它。</tspan>
      <tspan x="76" y="534">同时整理出 8 条不变量（6 条已有 trap 标志）。</tspan>
    </text>
    <line x1="76" y1="560" x2="608" y2="560" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="76" y="574" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="104" y="590">先写契约再写验证计划；验证改为 S1a–S4 分级</tspan>
    </text>
  </g>
  <g id="obs-4">
    <rect x="652" y="396" width="572" height="248" rx="8" fill="#F4F6F9"/>
    <text x="672" y="432" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="bold" fill="#E07A1F">04</text>
    <text x="716" y="430" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">AI 读 RTL 的结论会随代码过时</text>
    <text x="716" y="454" font-family="Consolas, monospace" font-size="12" fill="#2A7F9E">cycle-semantics</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="672" y="490">本地 main 落后 <tspan fill="#C62828" font-weight="bold">1558</tspan> 个提交时，"换 warp 有 1 拍气泡"</tspan>
      <tspan x="672" y="512">"VALU 4 级、IntAdd tap 1"都已不成立，</tspan>
      <tspan x="672" y="534">图和文档要全部重读。</tspan>
    </text>
    <line x1="672" y1="560" x2="1204" y2="560" stroke="#D8DEE6" stroke-width="1"/>
    <use data-icon="tabler-outline/bulb" x="672" y="574" width="20" height="20" fill="#E07A1F" stroke-width="2"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="700" y="590">每条结论写上<tspan font-weight="bold" fill="#1F3A5F">依据的提交号和行号</tspan>，</tspan>
      <tspan x="700" y="614">切换基准后逐项复核</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · subcore 组会 · 2026-10-10　|　根因类别取自 docs/design/ai-rtl-study/defect-template.yaml</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">13</text>
  </g>
</svg>
