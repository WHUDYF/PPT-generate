<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">已落地两步，都只改写法和归属，不改拍数</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">先把 S1、S2 整理成模板写法，再把挡发射的位从 subcore_top 搬进独立模块</text>
  </g>
  <g id="phase2">
    <rect x="56" y="128" width="572" height="516" rx="8" fill="#F4F6F9"/>
    <rect x="56" y="128" width="572" height="4" fill="#E07A1F"/>
    <use data-icon="tabler-outline/git-commit" x="76" y="152" width="28" height="28" fill="#1F3A5F" stroke-width="2"/>
    <text x="114" y="174" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="bold" fill="#222222">Phase 2 · S1 + S2 整理</text>
    <rect x="488" y="154" width="120" height="22" rx="11" fill="#E07A1F"/>
    <text x="548" y="170" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#FFFFFF">已实现 · 已提交</text>
    <text x="76" y="206" font-family="Consolas, monospace" font-size="14" fill="#666666">0fe1c31d4 · 11 个文件 · +3834 / −3747</text>
    <text x="76" y="246" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S1 · subcore_decode</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="76" y="274">· ANSI 端口，宽度用头部参数（PR #38 用的是字面值）</tspan>
      <tspan x="76" y="300">· DSP 式分节布局</tspan>
      <tspan x="76" y="326">· 补上 <tspan font-family="Consolas, monospace">vld_s0 / rdy_s0 / handshake_s0</tspan>，refill 改用握手</tspan>
    </text>
    <text x="76" y="370" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">S2 · sched_*（8 个文件）</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="76" y="398">· ANSI + 参数化 + DSP 分节</tspan>
      <tspan x="76" y="424">· lint 0 错误，少了 8 条警告</tspan>
    </text>
    <rect x="76" y="448" width="532" height="176" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="92" y="476" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#222222">sched_cggty_select：优先级只编码一次</text>
    <text x="92" y="508" font-family="Consolas, monospace" font-size="15" fill="#E07A1F">sel_case ∈ {HOLD, SWITCH, STICKY,</text>
    <text x="92" y="530" font-family="Consolas, monospace" font-size="15" fill="#E07A1F">            OLDEST, NONE}</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="92" y="564">三个输出都由 sel_case 派生</tspan>
      <tspan x="92" y="588">原来是三处 if 链，PR #38 还复制成了三份</tspan>
    </text>
  </g>
  <g id="d1">
    <rect x="652" y="128" width="572" height="516" rx="8" fill="#F4F6F9"/>
    <rect x="652" y="128" width="572" height="4" fill="#2A7F9E"/>
    <use data-icon="tabler-outline/stack-2" x="672" y="152" width="28" height="28" fill="#1F3A5F" stroke-width="2"/>
    <text x="710" y="174" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="bold" fill="#222222">d1 · hold 位成模块</text>
    <rect x="1084" y="154" width="120" height="22" rx="11" fill="none" stroke="#E07A1F" stroke-width="1.5"/>
    <text x="1144" y="170" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#E07A1F">已实现 · 未提交</text>
    <text x="672" y="206" font-family="Consolas, monospace" font-size="14" fill="#666666">rtl/src/subcore_issue_hold.v · 142 行</text>
    <text x="672" y="246" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">原样搬入</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="672" y="274">· setmax / membar / cctl 的 block 位</tspan>
      <tspan x="672" y="300">· 每 warp 8 位 ERRBAR 计数</tspan>
    </text>
    <text x="672" y="344" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="bold" fill="#1F3A5F">同拍优先级与原版一致</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">
      <tspan x="672" y="372">· setmax、membar：同拍 done 优先</tspan>
      <tspan x="672" y="398">· cctl：同拍 issue 优先</tspan>
      <tspan x="672" y="424">· launch / retire 清整行</tspan>
    </text>
    <rect x="672" y="448" width="532" height="176" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="688" y="476" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#222222">subcore_top 里的变化</text>
    <text x="688" y="508" font-family="Consolas, monospace" font-size="15" fill="#666666" text-decoration="line-through">head_valid &amp; ~a &amp; ~b &amp; ~c &amp; ~d &amp; ~e</text>
    <text x="688" y="534" font-family="Consolas, monospace" font-size="15" fill="#E07A1F">head_valid &amp; ~(issue_hold | tmem_fence_hold)</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="688" y="568">subcore_top +40 / −48 行，rtl_sources.f +1 行</tspan>
      <tspan x="688" y="592">MEMBAR 的 pend / wait / ok 子状态仍留在 subcore_top</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · subcore 组会 · 2026-10-10　|　分支 subcore-pipeline-structure</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">11</text>
