<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="arrowPrimary" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#E07A1F"/>
    </marker>
  </defs>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">照它生成的 RTL，为什么流水线会混乱</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">模型里"一次算完"的每一件事，都被原样搬进了 RTL 的同一拍，而 RTL 里这些事分属不同的级</text>
  </g>
  <g id="table-head">
    <rect x="56" y="128" width="340" height="38" fill="#1F3A5F"/>
    <rect x="396" y="128" width="40" height="38" fill="#1F3A5F"/>
    <rect x="436" y="128" width="360" height="38" fill="#1F3A5F"/>
    <rect x="796" y="128" width="40" height="38" fill="#1F3A5F"/>
    <rect x="836" y="128" width="388" height="38" fill="#1F3A5F"/>
    <text x="72" y="153" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#FFFFFF">性能模型这样做</text>
    <text x="452" y="153" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#FFFFFF">照搬进 RTL 就成了</text>
    <text x="852" y="153" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#FFFFFF">在原 RTL 里看到的</text>
  </g>
  <g id="row-1">
    <rect x="56" y="166" width="1168" height="80" fill="#F4F6F9"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="72" y="194">在发射这一个函数里，</tspan>
      <tspan x="72" y="216">一次查完读冲突、占用、写口、credit</tspan>
    </text>
    <text x="406" y="214" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="452" y="194">S2 的一个大组合锥：选择、</tspan>
      <tspan x="452" y="216">allocate、ITS、分发、RF 读地址同一拍</tspan>
    </text>
    <text x="806" y="214" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#C62828">
      <tspan x="852" y="194">估计 35–45 级逻辑；发射路径上</tspan>
      <tspan x="852" y="216">只有 IB → head 一处寄存器边界</tspan>
    </text>
  </g>
  <g id="row-2">
    <rect x="56" y="250" width="1168" height="80" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="72" y="278">要知道后级有没有空，</tspan>
      <tspan x="72" y="300">直接读对方的状态</tspan>
    </text>
    <text x="406" y="298" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="452" y="278">调度器组合读执行单元内部信号，</tspan>
      <tspan x="452" y="300">写口预约藏在调度器里</tspan>
    </text>
    <text x="806" y="298" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#C62828">
      <tspan x="852" y="278">sched_top 读 collect_fire、rd_busy、</tspan>
      <tspan x="852" y="300">valu_wb_warps（跨级组合读取）</tspan>
    </text>
  </g>
  <g id="row-3">
    <rect x="56" y="334" width="1168" height="80" fill="#F4F6F9"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="72" y="362">写回拍 = 发射拍 + 延迟，</tspan>
      <tspan x="72" y="384">不含读冲突造成的推迟</tspan>
    </text>
    <text x="406" y="382" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="452" y="362">写回窗口只按"延迟"检查，</tspan>
      <tspan x="452" y="384">没有读口表，也没有按写口分的预约表</tspan>
    </text>
    <text x="806" y="382" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#C62828">
      <tspan x="852" y="362">写回窗口只覆盖部分类别，IntAdd（tap 6）</tspan>
      <tspan x="852" y="384">这类指令不在检查里</tspan>
    </text>
  </g>
  <g id="row-4">
    <rect x="56" y="418" width="1168" height="80" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="72" y="446">完成、还 credit 都是零延迟事件，</tspan>
      <tspan x="72" y="468">当拍就可见</tspan>
    </text>
    <text x="406" y="466" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="452" y="446">完成事件同一拍回到调度器，</tspan>
      <tspan x="452" y="468">没有寄存、没有向后的通道</tspan>
    </text>
    <text x="806" y="466" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#C62828">
      <tspan x="852" y="446">scoreboard 在完成的同一拍组合释放：</tspan>
      <tspan x="852" y="468">released = counter_q − decrement</tspan>
    </text>
  </g>
  <g id="row-5">
    <rect x="56" y="502" width="1168" height="80" fill="#F4F6F9"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="72" y="530">没有 IB 和 head，同一 warp 的</tspan>
      <tspan x="72" y="552">发射间隔就是 max(1, stall)</tspan>
    </text>
    <text x="406" y="550" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="452" y="530">每 warp 只有 1 项 head，发射后</tspan>
      <tspan x="452" y="552">要等补充，补充用寄存的有效位</tspan>
    </text>
    <text x="806" y="550" font-family="Arial, sans-serif" font-size="22" fill="#E07A1F">→</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#C62828">
      <tspan x="852" y="530">波形确认：同一 warp 隔拍发射，</tspan>
      <tspan x="852" y="552">单 warp 峰值 IPC 0.5，与模型对不上</tspan>
    </text>
  </g>
  <g id="conclusion">
    <rect x="56" y="598" width="1168" height="76" rx="8" fill="#1F3A5F"/>
    <use data-icon="tabler-outline/bulb" x="76" y="618" width="30" height="30" fill="#E07A1F" stroke-width="2"/>
    <text x="124" y="630" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#FFFFFF">模型和 RTL 之间缺了一层"流水级结构"</text>
    <text x="124" y="656" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#FFFFFF" fill-opacity="0.85">每一级做什么、级间寄存什么、哪份状态归谁——先定这一层，再让人或 AI 按它写 RTL</text>
  </g>
  <g id="footer">
    <text x="56" y="702" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · subcore 组会 · 2026-10-10　|　右列为读 RTL 得出（规范 §3 第 6 条、§10；单 warp 间隔经波形确认）</text>
    <text x="1224" y="702" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">04</text>
  </g>
</svg>
