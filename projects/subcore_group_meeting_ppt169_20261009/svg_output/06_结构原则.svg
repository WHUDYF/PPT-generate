<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">一个握手模板 + 三条边界规则，S2 是唯一的单拍环</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">7 个大级每拍并行，各自处理不同 warp；大级内部照公司 DSP 设计 DSP.v 的任务流水线写法</text>
  </g>
  <g id="big-pipeline">
    <rect x="56" y="128" width="1168" height="56" rx="8" fill="#F4F6F9"/>
    <rect x="72" y="140" width="138" height="32" rx="4" fill="#1F3A5F"/>
    <text x="141" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">S0 fetch</text>
    <rect x="234" y="140" width="138" height="32" rx="4" fill="#1F3A5F"/>
    <text x="303" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">S1 decode</text>
    <rect x="396" y="140" width="138" height="32" rx="4" fill="#E07A1F"/>
    <text x="465" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#FFFFFF">S2 issue</text>
    <rect x="558" y="140" width="138" height="32" rx="4" fill="#1F3A5F"/>
    <text x="627" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">S3 dispatch</text>
    <rect x="720" y="140" width="138" height="32" rx="4" fill="#1F3A5F"/>
    <text x="789" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">S4 operand</text>
    <rect x="882" y="140" width="138" height="32" rx="4" fill="#1F3A5F"/>
    <text x="951" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">S5 exe_&lt;unit&gt;</text>
    <rect x="1044" y="140" width="164" height="32" rx="4" fill="#1F3A5F"/>
    <text x="1126" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#FFFFFF">SW wb</text>
  </g>
  <g id="handshake-template">
    <text x="56" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#1F3A5F">小级握手模板（取自 DSP.v）</text>
    <rect x="56" y="242" width="540" height="40" fill="#1F3A5F"/>
    <text x="76" y="268" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#FFFFFF">信号</text>
    <text x="276" y="268" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#FFFFFF">定义</text>
    <text x="76" y="314" font-family="Consolas, monospace" font-size="17" fill="#222222">rdy_sN</text>
    <text x="276" y="314" font-family="Consolas, monospace" font-size="17" fill="#222222">ena_s(N+1)</text>
    <line x1="56" y1="330" x2="596" y2="330" stroke="#D8DEE6" stroke-width="1"/>
    <text x="76" y="360" font-family="Consolas, monospace" font-size="17" fill="#222222">handshake_sN</text>
    <text x="276" y="360" font-family="Consolas, monospace" font-size="17" fill="#222222">rdy &amp; vld</text>
    <line x1="56" y1="376" x2="596" y2="376" stroke="#D8DEE6" stroke-width="1"/>
    <text x="76" y="406" font-family="Consolas, monospace" font-size="17" fill="#222222">ena_sN</text>
    <text x="276" y="406" font-family="Consolas, monospace" font-size="17" fill="#222222">handshake | ~vld</text>
    <line x1="56" y1="422" x2="596" y2="422" stroke="#D8DEE6" stroke-width="1"/>
    <text x="76" y="452" font-family="Consolas, monospace" font-size="17" fill="#222222">vld_sN</text>
    <text x="276" y="452" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">寄存器</text>
    <line x1="56" y1="468" x2="596" y2="468" stroke="#D8DEE6" stroke-width="1"/>
    <text x="76" y="498" font-family="Consolas, monospace" font-size="17" fill="#222222">x_sN</text>
    <text x="276" y="498" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">在上游握手时采样</text>
    <line x1="56" y1="514" x2="596" y2="514" stroke="#D8DEE6" stroke-width="1"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="56" y="548">与 DSP 的区别：DSP 外层是互斥的任务 FSM，subcore 外层没有。</tspan>
      <tspan x="56" y="572">FSM 只用在"一次做一件、要做多拍"的单元：SFU、XLANE、分支序列、上下文切换。</tspan>
    </text>
    <rect x="56" y="596" width="540" height="56" rx="8" fill="#F4F6F9"/>
    <use data-icon="tabler-outline/cpu" x="72" y="612" width="24" height="24" fill="#1F3A5F" stroke-width="2"/>
    <text x="108" y="630" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222"><tspan font-weight="bold">一大级一模块</tspan> subcore_&lt;级名&gt;，subcore_top 只做连接</text>
  </g>
  <g id="boundary-rules">
    <text x="640" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#1F3A5F">三条边界规则</text>
    <circle cx="656" cy="264" r="14" fill="#1F3A5F"/>
    <text x="656" y="269" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="682" y="270" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">向前只走寄存器（<tspan font-family="Consolas, monospace">vld</tspan> + 已寄存的 payload）</text>
    <circle cx="656" cy="304" r="14" fill="#1F3A5F"/>
    <text x="656" y="309" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="682" y="310" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">向后只走已寄存的事件通道，目的级 <tspan fill="#E07A1F" font-weight="bold">+1 拍</tspan>看到</text>
    <circle cx="656" cy="344" r="14" fill="#1F3A5F"/>
    <text x="656" y="349" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="682" y="350" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" fill="#222222">每份状态只有一个主人，只有主人能写</text>
  </g>
  <g id="s2-loop">
    <rect x="640" y="384" width="584" height="268" rx="8" fill="#FFFFFF" stroke="#E07A1F" stroke-width="2"/>
    <use data-icon="tabler-outline/lock" x="660" y="402" width="24" height="24" fill="#E07A1F" stroke-width="2"/>
    <text x="694" y="421" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="bold" fill="#222222">S2 是唯一的单拍环：白名单只放在 S2</text>
    <text x="660" y="452" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">发射沿上更新、下一拍选 warp 就要读到的状态</text>
    <rect x="660" y="472" width="168" height="36" rx="18" fill="#F4F6F9"/>
    <text x="744" y="496" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">head 消耗</text>
    <rect x="840" y="472" width="168" height="36" rx="18" fill="#F4F6F9"/>
    <text x="924" y="496" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">stall 载入</text>
    <rect x="1020" y="472" width="184" height="36" rx="18" fill="#F4F6F9"/>
    <text x="1112" y="496" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">SB +1</text>
    <rect x="660" y="520" width="168" height="36" rx="18" fill="#F4F6F9"/>
    <text x="744" y="544" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">credit −1</text>
    <rect x="840" y="520" width="168" height="36" rx="18" fill="#F4F6F9"/>
    <text x="924" y="544" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#222222">last_issued / yield</text>
    <rect x="1020" y="520" width="184" height="36" rx="18" fill="#F4F6F9"/>
    <text x="1112" y="544" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">隐式 SB 置位</text>
    <rect x="660" y="568" width="168" height="36" rx="18" fill="#F4F6F9"/>
    <text x="744" y="592" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#222222">ITS 状态更新</text>
    <text x="840" y="592" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">其他级的状态都可以晚 1 拍看到</text>
    <rect x="660" y="618" width="120" height="22" rx="11" fill="#2A7F9E"/>
    <text x="720" y="634" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#FFFFFF">已定 · 未实现</text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">curryGPU · subcore 组会 · 2026-10-10　|　依据：document/2026-10-05-subcore-rtl-structure-spec.md</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">06</text>
  </g>
</svg>
