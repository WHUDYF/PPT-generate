<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <rect x="56" y="44" width="6" height="36" fill="#1F3A5F"/>
    <text x="76" y="74" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="bold" fill="#1F3A5F">每一步都留下可重复的证据：0 差异、拍数不变</text>
    <text x="76" y="104" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#666666">保持行为的步骤用逐信号比对；会改拍数的步骤只用端到端用例</text>
  </g>
  <g id="kpi-1">
    <rect x="56" y="128" width="275" height="176" rx="8" fill="#F4F6F9"/>
    <rect x="56" y="128" width="4" height="176" fill="#2E7D32"/>
    <use data-icon="tabler-outline/checks" x="76" y="146" width="26" height="26" fill="#2E7D32" stroke-width="2"/>
    <text x="110" y="165" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">Phase 2 逐信号比对</text>
    <text x="76" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="40" font-weight="bold" fill="#2E7D32">0<tspan font-size="18" fill="#222222"> 差异</tspan></text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="76" y="258">100,158 个信号，无信号消失</tspan>
      <tspan x="76" y="280">只多出 4 个新信号（vld_s0 等）</tspan>
    </text>
  </g>
  <g id="kpi-2">
    <rect x="353" y="128" width="275" height="176" rx="8" fill="#F4F6F9"/>
    <rect x="353" y="128" width="4" height="176" fill="#2E7D32"/>
    <use data-icon="tabler-outline/flask" x="373" y="146" width="26" height="26" fill="#2E7D32" stroke-width="2"/>
    <text x="407" y="165" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">d1 A/B 比对</text>
    <text x="373" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="40" font-weight="bold" fill="#2E7D32">5/5<tspan font-size="18" fill="#222222"> PASS</tspan></text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="373" y="258">每个 kernel 的 PMU 行逐行相同</tspan>
      <tspan x="373" y="280">含分支/ITS、MEMBAR、mbarrier</tspan>
    </text>
  </g>
  <g id="kpi-3">
    <rect x="650" y="128" width="275" height="176" rx="8" fill="#F4F6F9"/>
    <rect x="650" y="128" width="4" height="176" fill="#1F3A5F"/>
    <use data-icon="tabler-outline/ruler" x="670" y="146" width="26" height="26" fill="#1F3A5F" stroke-width="2"/>
    <text x="704" y="165" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">iadd3 总拍数</text>
    <text x="670" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#1F3A5F">348,288</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="670" y="258">Phase 2 前后相同</tspan>
      <tspan x="670" y="280">kernel 89,279 拍也相同</tspan>
    </text>
  </g>
  <g id="kpi-4">
    <rect x="947" y="128" width="277" height="176" rx="8" fill="#F4F6F9"/>
    <rect x="947" y="128" width="4" height="176" fill="#E07A1F"/>
    <use data-icon="tabler-outline/clock" x="967" y="146" width="26" height="26" fill="#E07A1F" stroke-width="2"/>
    <text x="1001" y="165" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">lockstep 下单次运行</text>
    <text x="967" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="bold" fill="#E07A1F">35→17<tspan font-size="18" fill="#222222"> 分钟</tspan></text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#666666">
      <tspan x="967" y="258">结果稳定：349,783 / 89,228 拍</tspan>
      <tspan x="967" y="280">拍数不能当性能结果用</tspan>
    </text>
  </g>
  <g id="methods">
    <text x="56" y="346" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">两种比对方法</text>
    <rect x="56" y="362" width="560" height="134" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="72" y="390" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#222222">逐信号波形比对 <tspan font-family="Consolas, monospace" font-weight="normal" fill="#666666">wave_compare.py</tspan></text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="72" y="418">范围 u_subcore 约 10 万个信号，逐个比较变化序列</tspan>
      <tspan x="72" y="442">改名或新增的单列为 ONLY_BASE / ONLY_TEST</tspan>
      <tspan x="72" y="466">单次约 10 分钟；只适用于保持行为的步骤</tspan>
    </text>
    <rect x="56" y="508" width="560" height="134" rx="8" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="72" y="536" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#222222">A/B 拍数比对 <tspan font-family="Consolas, monospace" font-weight="normal" fill="#666666">model_compare.sh</tspan></text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="72" y="564">参考与被测模型并行跑同一组端到端 CUDA 用例</tspan>
      <tspan x="72" y="588">比较每个 kernel 的 PMU 行和 PASS / FAIL</tspan>
      <tspan x="72" y="612">默认开 lockstep；设 TRACE_WINDOW 时同时抓波形</tspan>
    </text>
  </g>
  <g id="nondeterminism">
    <text x="648" y="346" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="bold" fill="#1F3A5F">意外发现：SoC 仿真本身不确定</text>
    <rect x="648" y="362" width="576" height="182" rx="8" fill="#F4F6F9"/>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#222222">
      <tspan x="664" y="392">同一个参考二进制跑两次，落在两条时间线之一：</tspan>
      <tspan x="664" y="416"><tspan font-family="Consolas, monospace" fill="#C62828">18770 / 89279</tspan> 或 <tspan font-family="Consolas, monospace" fill="#C62828">20843 / 89251</tspan></tspan>
      <tspan x="664" y="448">原因在 runtime 而不在 RTL：引擎线程每片推进 4096 拍，</tspan>
      <tspan x="664" y="472">下一个 CUDA 请求落在哪一片边界取决于 OS 调度</tspan>
      <tspan x="664" y="504">处理：<tspan font-family="Consolas, monospace" fill="#E07A1F" font-weight="bold">CURRYGPU_LOCKSTEP=1</tspan>，等待者自己推进模拟器</tspan>
      <tspan x="664" y="528">补丁只留本地 document/patches/，不提交</tspan>
    </text>
    <rect x="648" y="556" width="576" height="86" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.5"/>
    <use data-icon="tabler-outline/alert-triangle" x="664" y="570" width="22" height="22" fill="#C62828" stroke-width="2"/>
    <text x="694" y="587" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="bold" fill="#222222">提交 d1 前待补</text>
    <text font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#666666">
      <tspan x="664" y="614">d1 的逐信号比对结论（两边已抓 trace.fst）</tspan>
      <tspan x="664" y="634">sm_context 往返测试（ctx 保存格式）的结果</tspan>
    </text>
  </g>
  <g id="footer">
    <text x="56" y="696" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">数据来源：2 SM 波形模型 curry2；.build/cmp-d1-iadd3、.build/cmp-d1-ls；document/2026-10-08-phase2-progress.md</text>
    <text x="1224" y="696" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#999999">12</text>
  </g>
</svg>
